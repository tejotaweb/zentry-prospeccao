<script>

(() => { const f = window.fetch.bind(window); window.fetch = async (...a) => { const r = await f(...a); if (r.status === 401) location.href = '/login'; return r; }; })();

fetch('/api/eu').then((r) => r.ok ? r.json() : null).then((j) => { if (j) { eu = j; try { desenhar(); } catch {} } }).catch(() => {});
const ehAdmin = () => eu.papel === 'admin';
function meuNome() { return (typeof cfg !== 'undefined' && cfg?.perfil?.nome) || 'Você'; }
function minhaCidade() { const c = ((typeof cfg !== 'undefined' && cfg?.perfil?.cidade) || '').split(',')[0].trim(); return c ? ` aqui em ${c}` : ''; }
async function sairDoSistema() { try { await fetch('/api/sair', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); } catch {} location.href = '/login'; }

// metas e régua vêm da tela Configurações (dados/config.json); estes são os padrões
let META = 10, LIMITE_DIA = 15, NOTA_MIN = 4, AVAL_MIN = 15, cfg = { perfil: {} };
const DIAS_RETORNO = [3, 7];
// a Conferência saiu do menu (02/11): a pesquisa já aprova e a empresa vai direto para Empresas
const SECOES = [['geral', 'Dashboard'], ['pesquisa', 'Pesquisa com IA'], ['lista', 'Empresas'], ['previas', 'Prévias'], ['mensagens', 'Mensagens'], ['resultado', 'Resultado']];
const ETAPAS_CONVERSA = [['', 'Ainda não falei'], ['enviada', 'Contatado'], ['respondeu', 'Respondeu'], ['pediu', 'Pediu para ver a prévia'], ['reuniao', 'Marcou reunião'], ['fechou', 'Fechou'], ['sem_interesse', 'Sem interesse'], ['encerrada', 'Encerrada sem resposta']];
const RESPONDEU = ['respondeu', 'pediu', 'reuniao', 'fechou', 'sem_interesse'];
const AVANCOU = { enviada: 1, respondeu: 2, pediu: 3, reuniao: 4, fechou: 5, sem_interesse: 2, encerrada: 1 };
const RETORNOS = [
  ['Aprovado por você', 'Oi, tudo bem? Voltando aqui rapidinho na nossa conversa. Sei que a rotina é corrida, então sem pressão nenhuma. Se um dia quiserem um site pra passar mais confiança pra quem chega pelo Instagram e pelo Google, pode contar comigo!'],
  ['Nova, falta sua aprovação', 'Oi, tudo bem? Passando rapidinho aqui. Sei que a rotina é puxada, então sem pressão. Se um dia fizer sentido ter um site pra quem chega pelo Instagram e pelo Google, pode me chamar!'],
  ['Nova, falta sua aprovação', 'Oi! Voltei só pra deixar a porta aberta, sem pressa nenhuma. Se um dia quiserem um site pra clínica, pode contar comigo!'],
];
const RESPOSTAS = [
  ['Depois que respondeu · adaptada do texto aprovado, falta sua aprovação', 'Eu mexo com site, então fico reparando nessas coisas kkk se um dia quiser ver como ficaria o da clínica, só chamar 🤙'],
  ['Se disser que já tem ou não quer · nova, falta sua aprovação', 'Show, obrigado por responder! Se um dia precisar, é só chamar. Sucesso pra vocês!'],
];

  rotulo: 'Exemplo · Dentistas', titulo: 'Painel de prospecção', fonte: 'Exemplo: empresas e números fictícios.',
  funil: [{ nome: 'Exemplo: na base', qtd: 100 }, { nome: 'Exemplo: ativas, 3 anos ou mais', qtd: 60 }, { nome: 'Exemplo: separadas para conferir', qtd: 3 }],
  empresas: ['A', 'B', 'C'].map((l, i) => ({ cnpj: `exemplo-${l}`, cnpj_formatado: 'fictício', nome: `Clínica Exemplo ${l}`, razao: 'Empresa fictícia', bairro_nome: 'Setor Fictício', endereco: 'Endereço fictício, Goiânia - GO', telefone: '(62) 0000-0000', anos: 4 + i, ano_abertura: 2022 - i, natureza: 'Fictícia' })),
};
const ESTADO_EXEMPLO = {

  'exemplo-B': { nota: '4,6', avaliacoes: '21', site: 'nao', cliente: 'nao', instagram: '@exemplo_b', b: { cor: '#7A4E8C', composicao: 'tipografica' }, m: { post: 'o reels da recepção', primeira: 'Kkkk o reels da recepção ficou bom demais', status: 'enviada', enviada_em: dataOffset(-4), ultimo_em: dataOffset(-4), retornos: 0 } },
};

const REDE_SOCIAL = /instagram\.com|facebook\.com|linktr\.ee|wa\.me|whatsapp\.com|bio\.link|linkin\.bio|beacons\.ai/i;
const temSiteProprio = (site) => !!site && !REDE_SOCIAL.test(site);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function dataOffset(dias) { const d = new Date(); d.setDate(d.getDate() + dias); return d.toLocaleDateString('sv-SE'); }
const hoje = () => dataOffset(0);
const dataBr = (iso) => iso ? iso.split('-').reverse().join('/') : '';
const reg = (cnpj) => (estado[cnpj] = estado[cnpj] || {});
const sub = (cnpj, chave) => { const r = reg(cnpj); return (r[chave] = r[chave] || {}); };

function avaliar(c = {}) {
  if (c.forcada) return { status: 'aprovada', motivos: [] }; // ele colocou na lista mesmo fora da régua
  const motivos = [];
  const nota = parseFloat(String(c.nota ?? '').replace(',', '.'));
  const avals = parseInt(c.avaliacoes, 10);
  const insta = String(c.instagram || '').trim();
  if (!isNaN(nota) && nota <= NOTA_MIN) motivos.push(`nota ${String(NOTA_MIN).replace('.', ',')} ou menor`);
  if (!isNaN(avals) && avals < AVAL_MIN) motivos.push(`menos de ${AVAL_MIN} avaliações`);
  if (c.cliente === 'sim') motivos.push('já é cliente');
  if (insta.toLowerCase() === 'sem') motivos.push('sem Instagram ativo');
  if (motivos.length) return { status: 'descartada', motivos };
  const completa = !isNaN(nota) && !isNaN(avals) && ['nao', 'tem'].includes(c.site) && c.cliente === 'nao' && insta;
  return { status: completa ? 'aprovada' : 'conferir', motivos };
}
const olhada = (c = {}) => ['nota', 'avaliacoes', 'site', 'cliente', 'instagram'].some((k) => c[k]);
// Contatos clicáveis de cada empresa: cada ícone abre o WhatsApp, o Instagram, o Maps e o site oficiais
const ICONES = {
  zap: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.2-.2-.5-.3Z"/></svg>',
  insta: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
  mapa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  site: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
};
function contatosDe(e) {
  const c = e.contatos || {};
  const insta = String(e.instagram || c.instagram || '').trim();
  const urlInsta = !insta || insta.toLowerCase() === 'sem' ? '' : /^https?:/.test(insta) ? insta : `https://www.instagram.com/${insta.replace(/^@/, '').replace(/\/$/, '')}/`;
  let zap = String(e.whatsapp || c.whatsapp || '').replace(/\D/g, '');
  // sem WhatsApp divulgado: o celular do Google (DDD + 9 dígitos começando com 9) quase sempre é o WhatsApp da empresa
  let zapGoogle = false;
  if (!zap) { const tel = String(e.telefone || '').replace(/\D/g, '').replace(/^55/, ''); if (/^\d{2}9\d{8}$/.test(tel)) { zap = tel; zapGoogle = true; } }
  if (zap && !zap.startsWith('55')) zap = '55' + zap;
  const maps = e.google_maps || c.google_maps || (e.nome ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([e.nome, e.endereco].filter(Boolean).join(', '))}` : '');
  const site = String(e.site || c.site || e.dica?.site || '').trim();
  const usuario = urlInsta ? urlInsta.replace(/\/$/, '').split('/').pop() : '';
  return { urlInsta, usuario, dm: usuario ? `https://ig.me/m/${usuario}` : '', zapGoogle, zapNum: zap, zap: zap.length >= 12 ? `https://wa.me/${zap}` : '', maps, site: site && (/^https?:/.test(site) ? site : `https://${site}`) };
}
function linksContato(e) {
  const k = contatosDe(e);
  const icone = (url, tipo, nome) => url
    ? `<a class="icone ${tipo}" href="${esc(url)}" target="_blank" rel="noopener" title="${nome}" aria-label="${nome} de ${esc(e.nome)}">${ICONES[tipo]}</a>`
    : `<span class="icone sem" title="Sem ${nome.toLowerCase()}" aria-label="Sem ${nome.toLowerCase()}">${ICONES[tipo]}</span>`;
  return `<div class="contatos">${icone(k.zap, 'zap', 'WhatsApp')}${icone(k.urlInsta, 'insta', 'Instagram')}${icone(k.maps, 'mapa', 'Google Maps')}${icone(k.site, 'site', 'Site')}</div>`;
}
const linkEndereco = (e) => e.endereco ? `<a class="endereco" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.endereco)}" target="_blank" rel="noopener">${esc(e.endereco)}</a>` : '';
const empresas = () => lista.empresas;
const aprovadas = () => empresas().filter((e) => avaliar(estado[e.cnpj]).status === 'aprovada');
const contagem = () => {
  const n = { conferir: 0, aprovada: 0, descartada: 0 };
  empresas().forEach((e) => n[avaliar(estado[e.cnpj]).status]++);
  return n;
};
const enviadasHoje = () => empresas().filter((e) => estado[e.cnpj]?.m?.enviada_em === hoje()).length;

function retornoDevido(m = {}) {
  if (m.status !== 'enviada' || !m.ultimo_em) return null;
  const feitos = m.retornos || 0;
  if (feitos >= DIAS_RETORNO.length) return { fim: true };
  const dias = Math.floor((new Date(hoje()) - new Date(m.ultimo_em)) / 86400000);
  const prazo = DIAS_RETORNO[feitos];
  return { numero: feitos + 1, atrasado: dias >= prazo, faltam: prazo - dias };
}
const retornosNaData = () => aprovadas().filter((e) => { const r = retornoDevido(estado[e.cnpj]?.m); return r && (r.fim || r.atrasado); });

function selecionar(valor, itens) { return itens.map(([v, t]) => `<option value="${esc(v)}"${(valor || '') === v ? ' selected' : ''}>${esc(t)}</option>`).join(''); }
const GUIA = {
  geral: null,
  pesquisa: ['O sistema procura no Google, analisa e filtra as empresas. Só as aprovadas entram na lista.', 'Escolher o nicho e o bairro e clicar em Pesquisar e analisar.', 'As aprovadas estão na lista, com contatos e links.'],
  lista: ['Todas as empresas, com contatos, nota do Google, site e em que etapa cada uma está.', 'Filtrar, buscar e clicar numa empresa para ver o detalhe e o próximo passo.', 'Você acha qualquer empresa em segundos.'],
  conferencia: ['Confere se a empresa é boa e se ela já tem site.', 'Abrir a busca, olhar a empresa e preencher os campos.', `Chegar a ${META} aprovadas.`],
  previas: ['Produz um site de proposta para cada empresa aprovada.', 'Pedir ao Claude e dar o veredito no fim.', 'Você aprovar a prévia.'],
  mensagens: ['Prepara os textos e controla o limite do dia.', 'Ler um post real, escrever, enviar e marcar aqui.', 'Mensagem enviada pela sua conta.'],
  resultado: ['Mostra respostas, reuniões e retornos na data.', 'Atualizar em que pé está cada conversa.', 'Dá para ver se vale continuar.'],
};

function fluxo() {
  const n = contagem();
  const aprov = aprovadas();
  const itens = [['pesquisa', 'Pesquisa', iaBusca.aprovadas.length], ['lista', 'Empresas', empresas().length], ['conferencia', 'Aprovadas', n.aprovada], ['previas', 'Prévias prontas', aprov.filter((e) => ['veredito', 'aprovada'].includes(etapaAtual(e).id)).length], ['mensagens', 'Em conversa', aprov.filter((e) => estado[e.cnpj]?.m?.status).length], ['resultado', 'Reuniões', aprov.filter((e) => (AVANCOU[estado[e.cnpj]?.m?.status] || 0) >= 4 && estado[e.cnpj].m.status !== 'sem_interesse').length]];
  return `<div class="fluxo">${itens.map(([id, nome, q]) => `<button data-secao="${id}" aria-current="${secao === id}"><b>${q}</b><span>${nome}</span></button>`).join('')}</div>`;
}

const cabecalho = (titulo, intro) => {
  const g = GUIA[secao];
  return `${exemplo ? '<div class="aviso">Modo de exemplo: empresas fictícias, e nada fica salvo. O exemplo sai quando a primeira empresa real entrar.</div>' : ''}<h1>${titulo}</h1><p class="intro">${intro}</p>${g ? `<div class="guia"><div><span class="rot">O sistema</span>${esc(g[0])}</div><div class="voce"><span class="rot">Sua tarefa</span>${esc(g[1])}</div><div><span class="rot">Pronto quando</span>${esc(g[2])}</div></div>` : ''}`;
};

// menu lateral no estilo da referência dele (02/11): marca, busca com ⌘K, grupos, ícones e perfil embaixo; dá para recolher
const ICONE_NAV = {
  usuarios: '<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0M16 5.2a3.2 3.2 0 0 1 0 6.1M18 19a5.4 5.4 0 0 0-2.6-4.6"/>',

  sol: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  lua: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  busca: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  recolher: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
};
const iconeNav = (nome) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONE_NAV[nome]}</svg>`;
let navRecolhido = (() => { try { return localStorage.getItem('navRecolhido') === '1'; } catch { return false; } })();
function desenharNav() {
  const n = contagem();
  const extras = { lista: aprovadas().length, previas: aprovadas().filter((e) => producao[e.cnpj]?.layout && estado[e.cnpj]?.veredito !== 'aprovada').length, mensagens: n.aprovada, resultado: retornosNaData().length || '', usuarios: contasPendentes() || '' };
  const nomes = Object.fromEntries(SECOES);
  const item = (id, nome) => `<button class="zn-item" data-secao="${id}" aria-current="${secao === id}" title="${esc(nome)}">${iconeNav(id)}<em>${esc(nome)}</em>${extras[id] ? `<span>${extras[id]}</span>` : ''}</button>`;
  const claro = document.documentElement.dataset.tema === 'claro';
  const p = cfg.perfil || {};
  document.querySelector('.app').classList.toggle('recolhido', navRecolhido);
  $('nav').innerHTML = `<div class="zn-marca"><span class="zn-logo">Z</span><div><b>Zentry<sup>®</sup></b><small>Prospecção de sites</small></div></div>
    <label class="zn-busca" data-nav-abre-busca title="Buscar empresa (⌘K)">${iconeNav('busca')}<input data-nav-busca placeholder="Buscar empresa…" aria-label="Buscar empresa"><kbd>⌘K</kbd></label>
    <span class="zn-grupo">Geral</span>${item('geral', nomes.geral)}${item('pesquisa', nomes.pesquisa)}
    <span class="zn-grupo">Prospecção</span>${['lista', 'previas', 'mensagens', 'resultado'].map((id) => item(id, nomes[id].replace(/^\d+\.\s*/, ''))).join('')}
    <div class="zn-pe">
      <button class="zn-item" data-acao="tema" title="${claro ? 'Tema escuro' : 'Tema claro'}">${iconeNav(claro ? 'lua' : 'sol')}<em>${claro ? 'Tema escuro' : 'Tema claro'}</em></button>
      ${ehAdmin() ? item('usuarios', 'Usuários') : ''}
      ${item('config', 'Configurações')}
      <div class="zn-perfil"><button class="zn-eu" data-secao="perfil" aria-current="${secao === 'perfil'}" title="Meu perfil"><img src="/foto-perfil.jpg" alt=""><span><b>${esc(p.nome || 'Seu nome')}</b><small>${esc(p.arroba || '')}</small></span></button><button class="zn-sair" onclick="sairDoSistema()" title="Sair do sistema" aria-label="Sair do sistema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg></button>
        <button class="zn-recolhe" data-nav-recolhe title="${navRecolhido ? 'Abrir menu' : 'Recolher menu'}" aria-label="${navRecolhido ? 'Abrir menu' : 'Recolher menu'}">${iconeNav('recolher')}</button></div>
    </div>`;
}

// Visão geral em forma de painel de controle (pedido dele em 02/11, referência: dashboard de faturas)
let geralFiltro = 'aprovadas', geralSel = '', geralPeriodo = 'semana', geralDe = '', geralAte = '';
const PERIODOS = { hoje: ['Hoje', 0], semana: ['7 dias', 6], mes: ['Este mês', null], tudo: ['Tudo', Infinity], datas: ['Personalizado', 'datas'] };
// calendário próprio para escolher o período (pedido dele: "faz um layout de data")
let calAberto = false, calMes = '', calDe = '', calAte = '';
const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const somaMes = (ym, n) => { const d = new Date(ym + '-01T12:00'); d.setMonth(d.getMonth() + n); return d.toLocaleDateString('sv-SE').slice(0, 7); };
const ATALHOS = [['hoje', 'Hoje'], ['ontem', 'Ontem'], ['semana', '7 dias'], ['30', '30 dias'], ['mes', 'Este mês'], ['passado', 'Mês passado'], ['tudo', 'Tudo']];
function abreCalendario() {
  const dias = diasDoPeriodo();
  calDe = dias[0]; calAte = dias.at(-1); calMes = calAte.slice(0, 7); calAberto = true;
}
function aplicaAtalho(id) {
  const inicioMes = hoje().slice(0, 7) + '-01';
  if (['hoje', 'semana', 'mes', 'tudo'].includes(id)) { geralPeriodo = id; return; }
  const fim = id === 'ontem' ? dataOffset(-1) : id === 'passado' ? new Date(new Date(inicioMes + 'T12:00').getTime() - 864e5).toLocaleDateString('sv-SE') : hoje();
  const ini = id === 'ontem' ? dataOffset(-1) : id === '30' ? dataOffset(-29) : somaMes(inicioMes.slice(0, 7), -1) + '-01';
  [geralDe, geralAte, geralPeriodo] = [ini, fim, 'datas'];
}
function mesHtml(ym) {
  const [ano, mes] = ym.split('-').map(Number);
  const primeiro = new Date(ano, mes - 1, 1).getDay(), total = new Date(ano, mes, 0).getDate();
  const celulas = Array.from({ length: primeiro }, () => '<span></span>').concat(Array.from({ length: total }, (_, i) => {
    const d = `${ym}-${String(i + 1).padStart(2, '0')}`;
    const fim = calAte || calDe;
    const classe = [d === hoje() ? 'hoje' : '', d === calDe || d === calAte ? 'ponta' : '', calDe && fim && d > calDe && d < fim ? 'meio' : '', d === calDe && calAte && calAte !== calDe ? 'ini' : '', d === calAte && calAte !== calDe ? 'fim' : ''].filter(Boolean).join(' ');
    return d > hoje() ? `<span class="futuro">${i + 1}</span>` : `<button data-cal-dia="${d}" class="${classe}">${i + 1}</button>`;
  }));
  return `<div class="m-mes"><b>${MESES[mes - 1]} ${ano}</b><div class="m-sem">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map((x) => `<span>${x}</span>`).join('')}</div><div class="m-dias">${celulas.join('')}</div></div>`;
}
function calendario() {
  const nDias = calDe && calAte ? entreDatas(calDe, calAte).length : 0;
  return `<div class="m-calendario" role="dialog" aria-label="Escolher período">
      <div class="m-atalhos">${ATALHOS.map(([id, nome]) => `<button data-cal-atalho="${id}">${nome}</button>`).join('')}</div>
      <div class="m-cal-corpo">
        <div class="m-cal-nav"><button data-cal-mes="-1" aria-label="Mês anterior">‹</button><button data-cal-mes="1" aria-label="Próximo mês"${somaMes(calMes, 1) > hoje().slice(0, 7) ? ' disabled' : ''}>›</button></div>
        <div class="m-meses">${mesHtml(somaMes(calMes, -1))}${mesHtml(calMes)}</div>
        <div class="m-cal-base">
          <div class="m-cal-escolha"><span>${calDe ? dataBr(calDe) : 'Início'}</span><i>→</i><span>${calAte ? dataBr(calAte) : 'Fim'}</span>${nDias ? `<small>${nDias} dia(s)</small>` : '<small>Clique no dia de início e no de fim</small>'}</div>
          <div><button class="m-cal-cancela" data-cal-fecha>Cancelar</button><button class="m-cal-aplica" data-cal-aplica${calDe && calAte ? '' : ' disabled'}>Aplicar</button></div>
        </div>
      </div>
    </div>`;
}

// lista de dias entre duas datas (AAAA-MM-DD), incluindo as duas
function entreDatas(de, ate) {
  const dias = [];
  for (let d = new Date(de + 'T12:00'); d <= new Date(ate + 'T12:00'); d.setDate(d.getDate() + 1)) dias.push(d.toLocaleDateString('sv-SE'));
  return dias;
}
function noPeriodo(iso) {
  if (!iso) return false;
  if (geralPeriodo === 'datas') return iso >= geralDe && iso <= geralAte;
  const [, dias] = PERIODOS[geralPeriodo];
  if (dias === Infinity) return true;
  if (dias === null) return iso.slice(0, 7) === hoje().slice(0, 7);
  return iso >= dataOffset(-dias) && iso <= hoje();
}
// dias do período, para as barras (no máximo 31)
function diasDoPeriodo() {
  if (geralPeriodo === 'datas') return entreDatas(geralDe, geralAte).slice(-62);
  const [, dias] = PERIODOS[geralPeriodo];
  const n = dias === null ? Number(hoje().slice(8)) : dias === Infinity ? 30 : dias + 1;
  return Array.from({ length: Math.min(n, 31) }, (_, i) => dataOffset(i - Math.min(n, 31) + 1));
}
// números do período e a série por dia, para os cartões e o gráfico da Visão geral
function resultados() {
  const todas = empresas();
  const datas = (campo) => todas.map((e) => { const c = estado[e.cnpj] || {}; return campo === 'aprovada_em' ? (avaliar(c).status === 'aprovada' ? c.aprovada_em : null) : c.m?.[campo]; });
  const conta = (campo) => datas(campo).filter(noPeriodo).length;
  const aprov = todas.filter((e) => { const c = estado[e.cnpj] || {}; return avaliar(c).status === 'aprovada' && noPeriodo(c.aprovada_em); });
  const dias = diasDoPeriodo();
  const porDia = (campo) => { const l = datas(campo); return dias.map((d) => l.filter((x) => x === d).length); };
  return { aprov, env: conta('enviada_em'), resp: conta('respondeu_em'), fech: conta('fechou_em'), dias,
    serie: { aprovadas: porDia('aprovada_em'), enviadas: porDia('enviada_em'), respostas: porDia('respondeu_em') } };
}
const taxa = (a, b) => b ? `${Math.round((a / b) * 100)}%` : '—';

// gráfico de área com curva suave, desenhado em SVG
function grafico(r) {
  const W = 760, H = 230, base = H - 26, topo = 14;
  const { dias, serie } = r;
  const max = Math.max(2, ...serie.aprovadas, ...serie.enviadas, ...serie.respostas);
  const x = (i) => dias.length > 1 ? 10 + (i * (W - 20)) / (dias.length - 1) : W / 2;
  const y = (v) => base - (v / max) * (base - topo);
  const caminho = (vals) => vals.map((v, i) => {
    if (!i) return `M${x(0)},${y(v)}`;
    const cx = (x(i - 1) + x(i)) / 2;
    return `C${cx},${y(vals[i - 1])} ${cx},${y(v)} ${x(i)},${y(v)}`;
  }).join(' ');
  const area = (vals) => `${caminho(vals)} L${x(vals.length - 1)},${base} L${x(0)},${base} Z`;
  const grade = [0, .25, .5, .75, 1].map((f) => `<line x1="0" x2="${W}" y1="${y(max * f)}" y2="${y(max * f)}" class="d-gl"/><text x="${W}" y="${y(max * f) - 4}" class="d-gt" text-anchor="end">${Math.round(max * f)}</text>`).join('');
  const passo = Math.max(1, Math.ceil(dias.length / 8));
  const rotulos = dias.map((d, i) => i % passo === 0 || i === dias.length - 1 ? `<text x="${x(i)}" y="${H - 6}" class="d-gt" text-anchor="middle">${dataBr(d).slice(0, 5)}</text>` : '').join('');
  const pontos = dias.map((d, i) => `<g class="d-pt"><rect x="${x(i) - (W / dias.length) / 2}" y="0" width="${W / dias.length}" height="${base}" fill="transparent"/><line x1="${x(i)}" x2="${x(i)}" y1="${topo}" y2="${base}" class="d-guia"/><title>${dataBr(d)} · ${serie.aprovadas[i]} aprovada(s), ${serie.enviadas[i]} enviada(s), ${serie.respostas[i]} resposta(s)</title></g>`).join('');
  return `<svg class="d-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Atividade por dia">
      <defs><linearGradient id="d-fogo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--lima)" stop-opacity=".55"/><stop offset="1" stop-color="var(--lima)" stop-opacity="0"/></linearGradient>
      <linearGradient id="d-cinza" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ink)" stop-opacity=".16"/><stop offset="1" stop-color="var(--ink)" stop-opacity="0"/></linearGradient></defs>
      ${grade}
      <path d="${area(serie.aprovadas)}" fill="url(#d-cinza)"/><path d="${caminho(serie.aprovadas)}" class="d-l-aprov"/>
      <path d="${area(serie.enviadas)}" fill="url(#d-fogo)"/><path d="${caminho(serie.enviadas)}" class="d-l-env"/>
      <path d="${caminho(serie.respostas)}" class="d-l-resp"/>
      ${pontos}${rotulos}
    </svg>`;
}
const STATUS_CONVERSA = { enviada: 'Contatado', respondeu: 'Respondeu', pediu: 'Pediu para ver', reuniao: 'Reunião marcada', fechou: 'Fechou', sem_interesse: 'Sem interesse', encerrada: 'Encerrada' };
const iniciais = (nome) => String(nome).replace(/^(dra?\.?|dr\.)\s+/i, '').split(/\s+/).filter((p) => p.length > 2 || /^[A-Z]{2,}$/.test(p)).slice(0, 2).map((p) => p[0]).join('').toUpperCase() || '·';
const fotoDe = (e) => producao[e.cnpj]?.avatar ? `/previas/${encodeURIComponent(e.cnpj)}/${encodeURIComponent(producao[e.cnpj].avatar)}` : '';
// avatar com a foto de perfil ou logo da empresa; sem foto, as iniciais
const avatar = (e, classe = '') => fotoDe(e) ? `<i class="${classe} com-foto" title="${esc(e.nome)}"><img src="${fotoDe(e)}" alt=""></i>` : `<i class="${classe}" title="${esc(e.nome)}">${esc(iniciais(e.nome))}</i>`;
const avatares = (lista, max = 5) => `<div class="g-avatares">${lista.slice(0, max).map((e) => avatar(e)).join('')}${lista.length > max ? `<i class="mais">+${lista.length - max}</i>` : ''}</div>`;
const segmentos = (feito, total) => `<div class="g-segmentos">${Array.from({ length: total }, (_, i) => `<span class="${i < feito ? 'on' : ''}"></span>`).join('')}</div>`;

function situacaoEmpresa(e) {
  const c = estado[e.cnpj] || {};
  const st = avaliar(c).status;
  if (st !== 'aprovada') return { rot: st === 'descartada' ? 'Descartada' : 'A conferir', classe: st, passo: st === 'descartada' ? 'Nada a fazer.' : 'Conferir nota, avaliações, site e Instagram.', secao: 'lista' };
  if (c.m?.status) return { rot: STATUS_CONVERSA[c.m.status] || 'Em conversa', classe: 'conversa', passo: 'Atualizar a conversa na tela de Resultado.', secao: 'resultado' };
  const etapa = etapaAtual(e).id;
  if (etapa === 'aprovada') return { rot: 'Prévia aprovada', classe: 'pronta', passo: 'Escrever a primeira mensagem: reação curta a um post real.', secao: 'mensagens' };
  if (etapa === 'veredito') return { rot: 'Prévia pronta', classe: 'pronta', passo: 'Abrir a prévia e dar o seu veredito.', secao: 'previas' };
  const nome = ETAPAS_PREVIA.find((x) => x.id === etapa).nome;
  return { rot: `Prévia: ${nome.toLowerCase()}`, classe: 'producao', passo: 'Clique em "Gerar prévia": o modelo pronto monta o site em segundos, com as fotos reais dela.', secao: 'lista' };
}

// Visão geral no layout "Minimin" (referência dele de 02/11: "vamos testar esse layout... cada detalhe")
const pct = (a, b) => b ? (Math.round((a / b) * 1000) / 10).toFixed(1).replace('.', ',') : '0,0';
// barra com início em limão e tracinhos, como a da referência
const barraTracos = (f) => `<div class="m-barra"><span class="m-cheia" style="width:${Math.max(2, Math.min(100, f * 100))}%"></span><span class="m-tracos"></span></div>`;
const codigoBarras = (f) => `<div class="m-codigo">${Array.from({ length: 46 }, (_, i) => `<i class="${i / 46 < f ? 'on' : ''}" style="height:${45 + ((i * 37) % 55)}%"></i>`).join('')}</div>`;
function medidor(f, valor) {
  const r = 120, cx = 150, cy = 150, ang = Math.PI * (1 - Math.max(0, Math.min(1, f)));
  const px = cx + r * Math.cos(ang), py = cy - r * Math.sin(ang);
  const arco = `M${cx - r},${cy} A${r},${r} 0 0 1 ${px.toFixed(1)},${py.toFixed(1)}`;
  return `<div class="m-medidor"><svg viewBox="0 0 300 160"><defs><linearGradient id="m-arco" x1="0" x2="1"><stop offset="0" stop-color="#1b2a55"/><stop offset=".65" stop-color="var(--lima)"/><stop offset="1" stop-color="var(--laranja)"/></linearGradient></defs>
    <path d="M${cx - r},${cy} A${r},${r} 0 0 1 ${cx + r},${cy}" class="m-fundo"/>${f > 0 ? `<path d="${arco}" stroke="url(#m-arco)" class="m-arco"/>` : ''}<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="9" class="m-ponto"/></svg><b>${valor}</b></div>`;
}

const etiquetaDe = (e) => ETIQ[estado[e.cnpj]?.m?.status || ''] || ETIQ[''];
// seletor de etiqueta na lista: muda ali mesmo (pedido dele em 03/11)
const ORDEM_ETIQ = ['', 'enviada', 'respondeu', 'pediu', 'reuniao', 'fechou', 'sem_interesse', 'encerrada'];

const etiquetaSel = (e) => { const atual = estado[e.cnpj]?.m?.status || ''; return `<button class="l-tag l-tag-sel ${ETIQ[atual][1]}" data-etiq-abre="${esc(e.cnpj)}" aria-haspopup="menu" aria-expanded="${etiqMenu?.cnpj === e.cnpj}" aria-label="Etiqueta de ${esc(e.nome)}: ${ETIQ[atual][0]}">${ETIQ[atual][0]}<i aria-hidden="true">▾</i></button>`; };

}
function mudarEtiqueta(cnpj, status) {
  if (!status) { reg(cnpj).m = { atualizado_em: Date.now() }; salvar(); return; } // "A contatar" desfaz tudo (engano)

  if (status === 'fechou') m.fechou_em = dia;

}
const etiquetaHtml = (e) => { const [t, c] = etiquetaDe(e); const m = estado[e.cnpj]?.m || {}; return `<span class="l-tag ${c}" title="${esc(m.enviada_em ? `Contatado em ${dataBr(m.enviada_em)}${m.canal ? ` pelo ${m.canal}` : ''}` : t)}">${t}</span>`; };

// fila automática de prévias: o servidor monta sozinho; o painel pergunta o andamento a cada 10 s enquanto tiver algo rodando
const RODANDO = ['na fila', 'análise', 'layout'];
const filaDe = (e) => filaPrevias[e.cnpj] || null;
let filaTimer = null, ultimoAjustes = '';
function acompanharFila() {
  const ativo = Object.values(filaPrevias).some((f) => RODANDO.includes(f?.etapa))
    || Object.values(producao).some((p) => (p.ajustes || []).some((a) => ['na fila', 'fazendo'].includes(a.etapa)));
  if (!ativo || filaTimer) return;
  filaTimer = setTimeout(async () => {
    filaTimer = null;
    try {
      const antes = JSON.stringify(filaPrevias);
      const novo = await (await fetch('/api/ia/fila')).json();
      const ajustes = JSON.stringify(novo._ajustes || {}); delete novo._ajustes;
      const mudou = JSON.stringify(novo) !== antes || ajustes !== ultimoAjustes;
      filaPrevias = novo; ultimoAjustes = ajustes;
      if (mudou && !pvEditar && !document.querySelector('[data-ajuste-texto]:focus')) { await carregar(); return; }
    } catch {}
    acompanharFila();
  }, 10000);
}

function siteDe(e) {

const PEQUENAS = ['de', 'da', 'do', 'das', 'dos', 'e'];
const nomeBonito = (nome) => {
  const t = String(nome || '').trim();

};

// lista de Empresas no estilo da tabela do Dashboard (pedido dele em 03/11: "aquela não tá legal… tudo muito quadrado")
const CABECA_LISTA = '<thead><tr><th>Empresa</th><th>Google</th><th>Site</th><th>Contato</th><th>Etiqueta</th><th>Prévia</th></tr></thead>';
// site guardado da empresa aprovada: o link publicado (sempre a versão mais nova) ou, sem link, a cópia do painel
function siteDaPrevia(e) {
  const p = producao[e.cnpj] || {};
  return p.link ? `${p.link}?v=${p.versao || 0}` : `/previas/${encodeURIComponent(e.cnpj)}/?v=${p.versao || 0}`;
}

function linhaLista(e) {
  const g = notaGoogle(e), st = siteDe(e), otimizar = ofertaDe(e).startsWith('otimiza');
  const site = !st.url ? '<small>Site novo</small>' : st.fora ? '<small class="l-fora">Fora do ar</small>' : `<small>${otimizar ? 'Otimizar' : 'Refazer'}${st.nota ? ` · ${st.nota}/10` : ''}</small>`;
  const f = filaDe(e), p = producao[e.cnpj] || {};
  const previa = f && TXT_FILA[f.etapa] && !p.layout ? `<span class="l-fila ${f.etapa === 'erro' ? 'erro' : ''}" title="${esc(f.erro || '')}"><i></i>${TXT_FILA[f.etapa]}</span>`
    : p.layout && estado[e.cnpj]?.veredito === 'aprovada' ? `<span class="l-site-ok"><a class="g-chip pronta" href="${esc(siteDaPrevia(e))}" target="_blank" rel="noopener" title="Abrir o site da prévia">Ver site ↗</a><button class="l-editar" data-ir-previa="${esc(e.cnpj)}" title="Abrir em Prévias para editar">Editar</button></span>`
    : p.layout ? `<button class="g-chip pronta" data-ir-previa="${esc(e.cnpj)}">Prévia pronta</button>`
    : `<button class="g-chip l-gerar-chip" data-gerar-previas="${esc(e.cnpj)}">✦ Gerar prévia</button>`;
  return `<tr data-emp-abre="${esc(e.cnpj)}" data-nome="${esc(semAcento(e.nome + ' ' + (e.bairro_nome || '')))}" tabindex="0" aria-label="Ver ${esc(e.nome)}">
      <td><div class="d-emp">${avatar(e, 'g-av')}<span><b>${esc(nomeBonito(e.nome))}</b><small>${esc(e.bairro_nome || '—')}</small></span></div></td>
      <td>${g.nota ? `<b>${esc(String(g.nota).replace('.', ','))}</b> <small>(${esc(g.aval || '?')})</small>` : '<small>—</small>'}</td>
      <td>${site}</td>
      <td>${linksContato(e)}</td>
      <td>${etiquetaSel(e)}</td>
      <td>${previa}</td></tr>`;
}

function painelEmpresa(e) {
  const c = estado[e.cnpj] || {}, s = situacaoEmpresa(e), g = notaGoogle(e), st = siteDe(e), k = contatosDe(e), p = producaoDe(e);
  const tel = String(e.telefone || '').trim(), otimizar = ofertaDe(e).startsWith('otimiza');
  const [led, ledTxt] = ledSite(st), et = etapasDe(e);
  const sec = (n, titulo, corpo) => `<section class="t-sec"><h4><span>${String(n).padStart(2, '0')}</span>${titulo}</h4>${corpo}</section>`;
  const atalho = (url, icone, nome) => url
    ? `<a href="${esc(url)}" target="_blank" rel="noopener">${ICONES[icone]}<span>${nome}</span></a>`
    : `<span class="falta" title="${nome} não achado">${ICONES[icone]}<span>${nome}</span></span>`;
  const linhas = [['Google', g.nota ? `${String(g.nota).replace('.', ',')} ★ · ${g.aval || '?'} avaliações` : ''], ['Telefone', tel], ['Endereço', e.endereco || '']]
    .filter(([, v]) => v).map(([r, v]) => `<div><dt>${r}</dt><dd>${esc(v)}</dd></div>`).join('');
  const vel = e.site_velocidade, feito = e.site_feito_em ? `${e.site_feito_em.slice(5, 7)}/${e.site_feito_em.slice(0, 4)}` : '';
  const problemas = String(e.site_problemas || '').split(/;\s*/).filter(Boolean);
  const leitura = (rot, valor, extra) => `<div><dt>${rot}</dt><dd>${valor}</dd>${extra || ''}</div>`;
  let site = `<div class="t-status ${led}"><i></i><b>${ledTxt}</b>${st.url ? `<a href="${esc(st.url)}" target="_blank" rel="noopener">${esc(st.dominio)} ↗</a>` : ''}</div>`;
  if (st.fora) site += `<p class="t-nota">${esc(e.site_defeito.charAt(0).toUpperCase() + e.site_defeito.slice(1))}. Oferta: site novo.</p>`;
  else if (!st.url) site += '<p class="t-nota">Ela não tem site próprio. Oferta: site novo.</p>';
  else if (st.nota || vel || feito) site += `<dl class="t-leituras">
      ${leitura('Visual', st.nota ? `${st.nota}<small>/10</small>` : '—', st.nota ? medidorSeg(st.nota, 10, st.nota < 5 ? 'ruim' : st.nota < 8 ? 'medio' : 'bom') : '')}
      ${leitura('Celular', vel ? `${vel.nota}<small>/100</small>` : '—', vel ? medidorSeg(Math.round(vel.nota / 10), 10, vel.nota < 50 ? 'ruim' : vel.nota < 90 ? 'medio' : 'bom') : '')}
      ${leitura('Carrega em', vel ? esc(vel.carrega) : '—')}
      ${leitura('Feito em', feito || '—')}</dl>
      ${problemas.length ? `<ol class="t-defeitos">${problemas.map((x) => `<li>${esc(x.charAt(0).toUpperCase() + x.slice(1))}</li>`).join('')}</ol>` : ''}`;
  else site += '<p class="t-nota">Nota do visual e velocidade ainda não medidas.</p>';
  const analise = String(e.analise || c.obs || '').replace(/^Oferta: [^.]+\.\s*/, '').trim();
  const longa = analise.length > 260;
  const curta = longa ? analise.slice(0, 240).replace(/\s+\S*$/, '') + '…' : analise;
  const naFilaJa = RODANDO.includes(filaDe(e)?.etapa);
  const botao = p.layout && estado[e.cnpj]?.veredito === 'aprovada' ? `<div class="t-botoes"><a class="t-botao" href="${esc(siteDaPrevia(e))}" target="_blank" rel="noopener">Ver site ↗</a><button class="d-ver" data-ir-previa="${esc(e.cnpj)}">Editar</button></div>`
    : p.layout ? `<button class="t-botao" data-ir-previa="${esc(e.cnpj)}">Ver a prévia →</button>`
    : naFilaJa ? `<span class="k-fila"><i></i>${esc(TXT_FILA[filaDe(e).etapa])}</span>`
    : `<button class="t-botao" data-gerar-previas="${esc(e.cnpj)}">✦ Gerar prévia</button>`;
  return `<div class="e-fundo" data-emp-fecha></div>
    <aside class="e-painel t-painel" role="dialog" aria-label="${esc(e.nome)}">
      <header class="t-painel-topo">${mono('Ficha da empresa')}<button class="e-fechar" data-emp-fecha aria-label="Fechar">✕</button></header>
      <div class="t-ident grande">${avatar(e, 'g-av t-av')}<div><h2 title="${esc(e.nome)}">${esc(nomeBonito(e.nome))}</h2><small>${esc(e.bairro_nome || '')}</small></div></div>
      <div class="t-resumo"><div><dt>Oferta</dt><dd class="${otimizar ? 'otimizar' : 'novo'}">${otimizar ? 'Otimizar site' : 'Site novo'}</dd></div><div><dt>Etapa</dt><dd>${filaDe(e) && TXT_FILA[filaDe(e).etapa] ? esc(TXT_FILA[filaDe(e).etapa]) : esc(et.atual)}</dd></div><div><dt>Progresso</dt><dd>${et.feitas}/${et.lista.length}</dd></div></div>
      ${filaDe(e)?.etapa === 'erro' ? `<p class="t-erro">A prévia automática parou: ${esc(filaDe(e).erro)} <button class="d-ver" data-gerar-previas="${esc(e.cnpj)}">Tentar de novo</button></p>` : ''}
      <div class="t-tags"><span class="t-mono">Etiqueta</span><div>${['enviada', 'respondeu', 'pediu', 'reuniao', 'fechou', 'sem_interesse', 'encerrada'].map((k) => `<button data-etiqueta="${k}" data-cnpj-tag="${esc(e.cnpj)}" aria-pressed="${(estado[e.cnpj]?.m?.status || '') === k}" class="l-tag ${ETIQ[k][1]}">${ETIQ[k][0]}</button>`).join('')}</div>${estado[e.cnpj]?.m?.enviada_em ? `<small>Contatado em ${esc(dataBr(estado[e.cnpj].m.enviada_em))}${estado[e.cnpj].m.canal ? ` pelo ${esc(estado[e.cnpj].m.canal)}` : ''}</small>` : ''}</div>
      ${sec(1, 'Contato', `<div class="t-atalhos">${atalho(k.zap, 'zap', 'WhatsApp')}${atalho(k.urlInsta, 'insta', 'Instagram')}${atalho(k.maps, 'mapa', 'Maps')}${atalho(st.url, 'site', 'Site')}</div>${linhas ? `<dl class="t-linhas">${linhas}</dl>` : ''}`)}
      ${sec(2, 'Site atual', site)}
      ${curta ? sec(3, 'Como abordar', `<p class="t-txt">${esc(curta)}</p>${longa ? `<details class="e-mais"><summary>Ler análise completa</summary><p class="t-txt">${esc(analise)}</p></details>` : ''}`) : ''}
      ${sec(curta ? 4 : 3, 'Andamento', `<div class="t-passos">${et.lista.map(([nome, f], i) => `<div class="${f ? 'feito' : nome === et.atual ? 'agora' : ''}"><i></i><span>${esc(nome)}</span></div>`).join('')}</div>
        <div class="t-proximo"><div>${mono('Próximo passo')}<p>${esc(s.passo)}</p></div>${botao}</div>`)}
    </aside>`;
}

function telaLista() {
  const todas = aprovadas().slice().sort((a, b) => (estado[b.cnpj]?.aprovada_em || '').localeCompare(estado[a.cnpj]?.aprovada_em || '') || a.nome.localeCompare(b.nome));
  const st = (e) => estado[e.cnpj]?.m?.status || '';
  const grupos = {
    todas: ['Todas', todas],
    contatar: ['A contatar', todas.filter((e) => !st(e))],
    contatado: ['Contatado', todas.filter((e) => st(e) === 'enviada')],
    respondeu: ['Respondeu', todas.filter((e) => ['respondeu', 'pediu', 'reuniao'].includes(st(e)))],
    fechou: ['Fechou', todas.filter((e) => st(e) === 'fechou')],
    parou: ['Sem retorno', todas.filter((e) => ['sem_interesse', 'encerrada'].includes(st(e)))],
    novo: ['', todas.filter((e) => !ofertaDe(e).startsWith('otimiza'))],
    otimizar: ['', todas.filter((e) => ofertaDe(e).startsWith('otimiza'))],
  };
  const nichos = [...new Set(todas.map(nichoDe))].sort();
  if (empNicho && !nichos.includes(empNicho)) empNicho = '';
  const itens = (grupos[empFiltro] || grupos.todas)[1].filter((e) => (!empNicho || nichoDe(e) === empNicho) && (!empOferta || (empOferta === 'otimizar') === ofertaDe(e).startsWith('otimiza')));
  const semPrevia = todas.filter((e) => !producao[e.cnpj]?.layout && !RODANDO.includes(filaDe(e)?.etapa));
  const naFila = todas.filter((e) => RODANDO.includes(filaDe(e)?.etapa)).length;
  const aberta = todas.find((e) => e.cnpj === empAberta);
  setTimeout(filtraLinhas);
  // capa no estilo da Pesquisa e do Dashboard, com desenho próprio: as fotos das empresas ligadas como uma rede
  const fotos = todas.filter((e) => fotoDe(e)).slice(0, 7);
  const posicoes = [[62, 30], [78, 18], [90, 44], [72, 62], [86, 78], [58, 74], [96, 14]];
  const heroi = `<section class="m-heroi b-heroi c-heroi">
      <div class="b-fundo" aria-hidden="true"><span class="b-pontos"></span><span class="c-brilho"></span>
        <svg class="c-rede" viewBox="0 0 100 100" preserveAspectRatio="none">${fotos.slice(1).map((_, k) => `<line x1="${posicoes[0][0]}" y1="${posicoes[0][1]}" x2="${posicoes[k + 1][0]}" y2="${posicoes[k + 1][1]}"/>`).join('')}</svg>
        ${fotos.map((e, k) => `<img class="c-no" src="${fotoDe(e)}" alt="" style="left:${posicoes[k][0]}%;top:${posicoes[k][1]}%;animation-delay:${k * .6}s">`).join('')}<span class="z-grao"></span></div>
      <div class="b-txt"><span class="b-rot">${iconeNav('lista')}Empresas</span><h1>Prontas para<br><em>prospectar.</em></h1>
        <div class="b-status">${[[todas.length, 'aprovadas'], [grupos.novo[1].length, 'site novo'], [grupos.otimizar[1].length, 'otimizar site']].map(([n, r]) => `<span class="g-status"><b>${n}</b> ${r}</span>`).join('')}</div></div>
    </section>`;
  // barra de comando (pedido dele: "deixa isso com um design bonito"): um bloco só, dividido por linhas finas
  const opcao = (v, t, atual) => `<option value="${esc(v)}"${v === atual ? ' selected' : ''}>${esc(t)}</option>`;
  const seletor = (rot, attr, atual, opcoes) => `<label class="k-sel"><span>${rot}</span><select ${attr} aria-label="Filtrar por ${rot.toLowerCase()}">${opcoes.map(([v, t]) => opcao(v, t, atual)).join('')}</select><i aria-hidden="true">▾</i></label>`;
  const selNicho = seletor('Nicho', 'data-emp-nicho', empNicho, [['', 'Todos'], ...nichos.map((n) => [n, n.charAt(0).toUpperCase() + n.slice(1)])]);
  const selOferta = seletor('Oferta', 'data-emp-oferta', empOferta, [['', 'Todas'], ['novo', 'Site novo'], ['otimizar', 'Otimizar site']]);
  const acao = naFila ? `<span class="k-fila"><i></i>${naFila} prévia${naFila > 1 ? 's' : ''} em produção</span>`
    : semPrevia.length ? `<button class="k-acao" data-gerar-previas="${esc(semPrevia.map((e) => e.cnpj).join(','))}">${ICONE.faisca}Gerar ${semPrevia.length} prévia${semPrevia.length > 1 ? 's' : ''}</button>` : '';
  const barra = `<div class="k-barra">
      <label class="k-busca">${ICONE.busca}<input type="search" data-geral-busca value="${esc(buscaEmpresas)}" placeholder="Buscar pelo nome ou bairro" aria-label="Buscar empresa"></label>
      ${selNicho}${selOferta}${acao}
    </div>
    <div class="k-abas" role="tablist">${Object.entries(grupos).filter(([, [nome]]) => nome).map(([id, [nome, l]]) => `<button role="tab" data-emp-filtro="${id}" aria-selected="${empFiltro === id}" class="${l.length ? '' : 'zero'}">${nome}<span>${l.length}</span></button>`).join('')}</div>`;
  const grade = itens.length ? `<section class="d-bloco d-tabela m-card e-tabela"><div class="d-rolagem"><table>${CABECA_LISTA}<tbody>${itens.map((e) => linhaLista(e)).join('')}</tbody></table></div></section>`
    : `<div class="r-vazio"><b>${todas.length ? 'Nenhuma empresa neste filtro.' : 'Nenhuma empresa aprovada ainda.'}</b><span>As empresas aprovadas na pesquisa aparecem aqui sozinhas.</span><button class="d-ver" data-secao="pesquisa">Fazer uma pesquisa →</button></div>`;
  return heroi + barra + grade + (aberta ? painelEmpresa(aberta) : '') + menuEtiqueta();
}

function detalheEmpresa(e) {
  const c = estado[e.cnpj] || {};
  const s = situacaoEmpresa(e);
  const p = producaoDe(e);
  const aprovada = avaliar(c).status === 'aprovada';
  const etapas = [['Conferida', aprovada], ...ETAPAS_PREVIA.map((x) => [x.nome, aprovada && etapaFeita(x.id, e)]), ['Mensagem', !!c.m?.status], ['Reunião', (AVANCOU[c.m?.status] || 0) >= 4]];
  const atual = etapas.findIndex(([, feito]) => !feito);
  const nota = c.nota || e.dica?.nota, aval = c.avaliacoes || e.dica?.avaliacoes;
  const site = c.site === 'tem' ? 'Refazer o atual' : c.site === 'nao' ? 'Site novo' : 'A conferir';
  const botao = p.layout ? `<a class="g-ir" href="/previas/${esc(e.cnpj)}/" target="_blank" rel="noopener">Abrir prévia <i>↗</i></a>` : `<button class="g-ir" data-secao="${s.secao}">Abrir etapa <i>↗</i></button>`;
  return `<div class="g-detalhe">
      <div class="g-det-topo"><div class="g-det-id">${avatar(e, 'g-av grande')}<div><span class="g-rot">Empresa</span><h2>${esc(e.nome)}</h2><span class="g-chip ${s.classe}">${esc(s.rot)}</span></div></div>${e.contatos ? linksContato(e) : ''}</div>
      <div class="g-mini">
        <div><span class="g-rot">Google</span><b>${nota ? esc(String(nota).replace('.', ',')) : '—'}</b><small>${aval ? `${esc(aval)} avaliações` : 'sem nota ainda'}</small></div>
        <div><span class="g-rot">Site</span><b>${esc(site)}</b><small>${esc(c.site_url || e.contatos?.site || 'sem site próprio')}</small></div>
        <div><span class="g-rot">Instagram</span><b>${esc(c.instagram || e.contatos?.instagram || '—')}</b><small>${esc(e.bairro_nome || '')}</small></div>
      </div>
      <div class="g-etapas">${etapas.map(([nome, feito], i) => `<div class="${feito ? 'feito' : i === atual ? 'agora' : ''}"><i></i><span>${esc(nome)}</span></div>`).join('')}</div>
      <div class="g-det-base"><div><span class="g-rot">Próximo passo</span><p>${esc(s.passo)}</p></div>${botao}</div>
    </div>`;
}

const postJson = async (url, corpo) => {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Não deu certo.');
  return j;
};

      <div class="q-pop-base"><small>Escolhido: <b>${esc(local)}</b></small><small>Digite qualquer lugar e clique em usar.</small></div>`;

      <div class="q-pop-base"><small>Cada empresa usa 1 das ${outscraperLimite} notas do Google grátis do mês.</small></div>`;

      <div class="q-barra">
        ${segmento('nicho', 'Nicho', nicho || 'Escolha', painelNicho)}
        ${segmento('local', 'Onde', local || 'Escolha', painelLocal)}

        ${ehAdmin() || (eu.creditos || 0) >= quantidade
          ? `<button class="q-ir" data-acao="ia-buscar"${carregando ? ' disabled' : ''}>${ICONE.busca}${carregando ? 'Pesquisando…' : 'Pesquisar'}</button>`
          : `<button class="q-ir" disabled title="Peça créditos ao administrador">${ICONE.busca}Sem créditos</button>`}
      </div>
      ${ehAdmin() ? '' : `<p class="q-creditos ${(eu.creditos || 0) < quantidade ? 'falta' : ''}"><b>${eu.creditos || 0}</b> créditos · cada empresa pesquisada usa 1 crédito${(eu.creditos || 0) < quantidade ? ' · peça créditos ao administrador para pesquisar' : ''}</p>`}
      <div class="q-sob">
        <p>Vou procurar <b>${esc(quantidade)} ${esc(nicho)}</b> em <b>${esc(local)}</b> e trazer só as que passam na <button class="q-link" data-pq="regua">régua</button>.</p>
        <div class="q-estado">${[[true, 'Análise sem IA · não gasta token'], [outscraperLigado, outscraperLigado ? `Nota do Google · ${outscraperUso.lugares || 0}/${outscraperLimite}` : 'Nota do Google desligada'], [true, 'Nada é enviado sozinho']].map(([ok, t]) => `<span class="${ok ? 'ok' : 'falta'}">${ok ? '✓' : '!'} ${t}</span>`).join('')}</div>
      </div>
      ${pqAberto === 'regua' ? `<div class="q-regua-pop">${regua.map((r) => `<span>✓ ${esc(r)}</span>`).join('')}<small>Dá para mudar em Configurações.</small></div>` : ''}
      ${erro ? `<p class="alerta">${esc(erro)}</p>` : ''}
    </section>`;
  const lado = '';

  const progresso = caminhoFiltragem();

  const aba = iaResultadoAba;
  const comCategoria = descartadas.map((e, i) => ({ e, i, cat: categoriaDescarte(e) }));
  const contaCat = (c) => comCategoria.filter((x) => x.cat === c).length;
  const visiveis = comCategoria.filter((x) => resFiltro === 'todas' || x.cat === resFiltro);
  const subfiltro = aba === 'descartadas' && descartadas.length ? `<div class="r-sub">${[['todas', 'Todas', descartadas.length], ['google', 'Filtro do Google', contaCat('google')], ['regua', 'Régua final', contaCat('regua')], ['lista', 'Já na lista', contaCat('lista')]].filter(([id, , q]) => id === 'todas' || q).map(([id, nome, q]) => `<button data-res-filtro="${id}" aria-pressed="${resFiltro === id}">${nome}<span>${q}</span></button>`).join('')}</div>` : '';
  const resultado = (aprov.length || descartadas.length) ? `<section class="p-resultado">
      <div class="d-bloco-topo"><div><h3 class="p-tit">Resultado da pesquisa</h3><small class="r-sobre">${esc(iaBusca.prog?.nicho || nicho)} · ${esc(iaBusca.prog?.local || local)}</small></div>
        <div class="g-filtros"><button data-res-aba="aprovadas" aria-pressed="${aba === 'aprovadas'}">Aprovadas<span>${aprov.length}</span></button><button data-res-aba="descartadas" aria-pressed="${aba === 'descartadas'}">Descartadas<span>${descartadas.length}</span></button></div></div>
      ${subfiltro}
      ${aba === 'aprovadas'
        ? (aprov.length ? `<div class="r-lista">${aprov.map((e, k) => cartaoResultado(e, -1, 'aprovada', 'a' + k)).join('')}</div>` : '<div class="r-vazio"><b>Nenhuma passou na régua desta vez.</b><span>Veja em Descartadas o motivo de cada uma e coloque na lista quem você achar que vale.</span><button class="d-ver" data-res-aba="descartadas">Ver descartadas →</button></div>')
        : `<div class="r-lista">${visiveis.map(({ e, i, cat }) => cartaoResultado(e, i, cat, 'd' + i)).join('')}</div>`}
    </section>` : '';
  const aviso = confirmaRepetir ? `<section class="m-card h-aviso" role="alert"><div><b>Você já pesquisou ${esc(confirmaRepetir.nicho)} em ${esc(confirmaRepetir.local)}</b><small>Em ${esc(dataBr(confirmaRepetir.data.slice(0, 10)))} às ${esc(confirmaRepetir.data.slice(11))}: ${confirmaRepetir.total ?? '?'} encontradas, ${(confirmaRepetir.aprovadas || []).length} aprovadas. Pesquisar de novo gasta notas do Google.</small></div>
      <div class="h-acoes"><button class="q-ir" data-abre-busca="${esc(confirmaRepetir.id)}">Ver o resultado salvo</button><button class="d-ver" data-acao="ia-buscar" data-repetir="1">Pesquisar de novo</button><button class="d-ver" data-fecha-aviso>Cancelar</button></div></section>` : '';
  const historico = historicoBuscas.length ? `<section class="h-lista"><div class="h-topo"><span class="d-rot">Pesquisas anteriores</span><button class="h-limpar" data-acao="ia-limpar"${carregando ? ' disabled' : ''}>Limpar pesquisas</button></div><div>${historicoBuscas.slice(0, 12).map((h) => `<button data-abre-busca="${esc(h.id)}" aria-pressed="${buscaAberta === h.id}"><b>${esc(h.nicho)}</b><small>${esc(h.local)} · ${esc(dataBr(h.data.slice(0, 10)).slice(0, 5))} · ${(h.aprovadas || []).length}✓ ${(h.descartadas || []).length}✕</small></button>`).join('')}</div></section>` : '';
  return heroi + formulario + aviso + historico + progresso + resultado;
}

// Caminho da filtragem: 5 etapas, do Google Maps até Empresas (pedido dele: mostrar o processo do filtro)
function caminhoFiltragem() {
  const { aprovadas: aprov, descartadas: desc, carregando, nicho, local } = iaBusca;
  const feito = !carregando && (aprov.length + desc.length) > 0;
  const tem = (e, ...palavras) => e.motivos.some((m) => palavras.some((p) => semAcento(m).includes(p)));
  const total = aprov.length + desc.length;
  const foraGoogle = desc.filter((e) => tem(e, 'nota', 'avaliac', 'fechada', 'cliente', 'ja esta na lista'));
  const foraRegua = desc.filter((e) => !foraGoogle.includes(e));
  const passaGoogle = total - foraGoogle.length;
  const pr = iaBusca.prog || {};
  const agoraEtapa = carregando ? (pr.etapa ?? 0) : -1;
  const n = (v) => feito ? v : '—';
  const vivo = (v, sufixo = '') => (v === null || v === undefined) ? '…' : `${v}${sufixo}`;
  const barraViva = (passou, de) => passou != null && de ? `<div class="f-barra"><span style="width:${(passou / de) * 100}%"></span></div>` : '<div class="f-barra vazia"><span></span></div>';
  const barra = (passou, de) => feito && de ? `<div class="f-barra"><span style="width:${(passou / de) * 100}%"></span></div>` : '<div class="f-barra vazia"><span></span></div>';
  const etapa = (i, icone, titulo, texto, chips, numero, legenda, extra = '') => `<article class="f-etapa${agoraEtapa === i ? ' agora' : ''}${(feito || (carregando && i < agoraEtapa)) ? ' feito' : ''}" style="--i:${i}">
      <div class="f-topo"><span class="f-num">0${i + 1}</span><i class="f-ico">${ICONE[icone]}</i></div>
      <h4>${titulo}</h4><p>${texto}</p>
      <div class="f-chips">${chips.map((c) => `<span>${c}</span>`).join('')}</div>
      <div class="f-conta"><b>${numero}</b><small>${legenda}</small></div>${extra}
    </article>`;
  const seta = (i) => `<div class="f-seta${carregando && agoraEtapa === i + 1 ? ' rodando' : ''}${(feito || (carregando && agoraEtapa > i + 1)) ? ' passou' : ''}" style="--i:${i}" aria-hidden="true"><span></span></div>`;
  const destino = `<article class="f-etapa f-destino${feito ? ' feito' : ''}" style="--i:4">
      <div class="f-topo"><span class="f-num">05</span><i class="f-ico">${ICONE.check}</i></div>
      <h4>Empresas</h4><p>As que passam em tudo entram na lista, com os contatos.</p>
      <div class="f-conta"><b>${n(aprov.length)}</b><small>${feito ? 'aprovadas e já na lista' : 'aprovadas entram aqui'}</small></div>
      ${feito && aprov.length ? `<div class="g-avatares">${aprov.slice(0, 6).map((e) => `<i title="${esc(e.nome)}">${esc(iniciais(e.nome))}</i>`).join('')}</div>` : ''}
      <button class="d-ver" data-secao="lista">Abrir Empresas →</button>
    </article>`;
  const cab = carregando
    ? `<div class="f-cab"><h3><span class="f-pulso"></span>Pesquisando ${esc(nicho)} em ${esc(local)}</h3><span class="f-tempo">${['Buscando no Google Maps', 'Filtrando pelo Google', 'O Claude está analisando', 'Aplicando a régua', 'Gravando'][agoraEtapa] || 'Pesquisando'} · <b id="ia-tempo">0:00</b></span></div>`
    : feito
      ? `<div class="f-cab"><h3>Como foi a última pesquisa</h3><span class="f-tempo">${total} encontradas → ${aprov.length} aprovadas</span></div>`
      : `<div class="f-cab"><h3>Como a filtragem funciona</h3><span class="f-tempo">Cada empresa passa por 4 etapas antes de entrar na sua lista</span></div>`;
  return `<section class="f-caminho">${cab}<div class="f-trilha">
      ${etapa(0, 'busca', 'Busca no Google Maps', 'Procura o nicho na região e traz os dados do próprio Google.', ['Nota', 'Avaliações', 'Telefone', 'Link do Maps'], carregando ? vivo(pr.total) : n(total), carregando && agoraEtapa === 0 ? 'buscando…' : 'encontradas')}
      ${seta(0)}
      ${etapa(1, 'camadas', 'Filtro do Google', 'Tira quem não tem boa reputação ou já conhece você.', [`Nota acima de ${String(NOTA_MIN).replace('.', ',')}`, `${AVAL_MIN}+ avaliações`, 'Aberta', 'Não é cliente', 'Não repetida'], carregando ? vivo(pr.passa_google) : n(passaGoogle), feito ? `passaram · ${foraGoogle.length} saíram` : carregando && pr.fora_google != null ? `passaram · ${pr.fora_google} saíram` : 'passam', carregando ? barraViva(pr.passa_google, pr.total) : barra(passaGoogle, total))}
      ${seta(1)}
      ${etapa(2, 'faisca', 'Análise automática', 'Abre o site, mede a velocidade e procura o Instagram e o WhatsApp de cada uma. Sem gastar token.', ['Site', 'Instagram', 'WhatsApp', 'Rede ou franquia'], carregando ? (pr.analisadas == null ? '…' : `${pr.analisadas}/${pr.passa_google}`) : n(passaGoogle), carregando && agoraEtapa === 2 ? 'analisadas até agora' : 'analisadas', carregando ? barraViva(pr.analisadas, pr.passa_google) : '')}
      ${seta(2)}
      ${etapa(3, 'check', 'Régua final', 'Fica quem tem chance real de fechar um site com você.', ['Instagram ativo', 'Sem site ou site fraco', 'Fora de rede'], carregando ? '…' : n(aprov.length), feito ? `passaram · ${foraRegua.length} saíram` : 'passam', barra(aprov.length, passaGoogle))}
      ${seta(3)}
      ${destino}
    </div></section>`;
}

// resultado da pesquisa em cartões: o mesmo desenho para aprovadas e descartadas
let resFiltro = 'todas';
const categoriaDescarte = (e) => e.motivos.some((m) => /já está na lista|já é seu cliente/.test(m)) ? 'lista'
  : e.motivos.some((m) => /nota|avalia|fechada/.test(semAcento(m))) ? 'google' : 'regua';
const ETIQUETA = { aprovada: ['Aprovada', 'ok'], google: ['Saiu no filtro do Google', 'google'], regua: ['Saiu na régua final', 'regua'], lista: ['Já na lista', 'lista'] };
let resAberta = '', procurando = '';
const ETQ_CURTA = { aprovada: 'Aprovada', google: 'Google', regua: 'Régua', lista: 'Na lista' };
// uma linha limpa por empresa; site, Instagram, contatos, motivo e análise abrem ao clicar
function cartaoResultado(e, i, cat, chave) {
  const site = String(e.site || '').trim();
  const urlSite = site && (/^https?:/.test(site) ? site : `https://${site}`);
  const dominio = site.replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/.*$/, '');
  const insta = String(e.instagram || '').trim();
  const urlInsta = insta && insta !== '-' ? (/^https?:/.test(insta) ? insta : `https://www.instagram.com/${insta.replace(/^@/, '').replace(/\/$/, '')}/`) : '';
  const arroba = insta.startsWith('http') ? 'perfil' : insta.startsWith('@') ? insta : '@' + insta;
  const naLista = cat === 'lista' || empresas().some((x) => semAcento(x.nome) === semAcento(e.nome));
  const classe = ETIQUETA[cat][1], aberta = resAberta === chave;
  const acao = cat === 'aprovada' ? '<button class="r-btn" data-secao="lista">Ver</button>'
    : naLista ? '<span class="r-na">✓ Na lista</span>' : `<button class="r-btn" data-por-na-lista="${i}">Colocar na lista</button>`;
  const defeito = e.site_defeito || '';
  const notaSite = Number(e.site_nota) || 0;
  const feito = e.site_feito_em ? `${e.site_feito_em.slice(5, 7)}/${e.site_feito_em.slice(0, 4)}` : '';
  const motivo = cat === 'aprovada' ? (defeito ? 'Site fora do ar: site novo' : e.oferta === 'otimização do site' ? `Site recente${notaSite ? ` (nota ${notaSite}/10)` : ''}: otimizar` : site ? `Site fraco${notaSite ? ` (nota ${notaSite}/10)` : ''}: refazer` : 'Sem site: site novo') : e.motivos[0] + (e.motivos.length > 1 ? ` +${e.motivos.length - 1}` : '');
  // site na própria linha, com sinal: verde abriu, vermelho fora do ar, cinza ainda não testado
  const situ = !('site_defeito' in e) ? 'nao-testado' : defeito ? 'fora' : 'no-ar';
  const celSite = urlSite ? `<a class="r-site ${situ}" href="${esc(urlSite)}" target="_blank" rel="noopener" title="${esc(defeito || (situ === 'no-ar' ? 'Site no ar' : 'Ainda não testado'))}"><i></i>${esc(dominio)}</a>` : '<span class="r-site sem">sem site</span>';
  const foto = e.logo ? `<img src="${esc(e.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  const podeProcurar = !urlInsta || defeito;
  return `<div class="r-item${aberta ? ' aberta' : ''}">
      <div class="r-linha" data-res-abre="${chave}" role="button" tabindex="0" aria-expanded="${aberta}">
        <i class="g-av r-av">${esc(iniciais(e.nome))}${foto}</i>
        <div class="r-nome"><b title="${esc(e.nome)}">${esc(e.nome)}</b><small>${esc(motivo)}</small></div>
        ${celSite}
        <span class="r-nota">${e.nota ? `★ ${esc(e.nota)} <small>(${esc(e.avaliacoes)})</small>` : '—'}</span>
        <span class="r-etq ${classe}">${ETQ_CURTA[cat]}</span>
        <span class="r-acao">${acao}</span>
        <i class="r-seta">${aberta ? '−' : '+'}</i>
      </div>
      ${aberta ? `<div class="r-detalhe">
        <div class="r-dados">
          <div><span>Site atual${notaSite ? ` · nota ${notaSite}/10` : ''}${feito ? ` · de ${feito}` : ''}</span>${urlSite ? `<a href="${esc(urlSite)}" target="_blank" rel="noopener">${esc(dominio)} ↗</a>` : '<b class="apagado">sem site</b>'}</div>
          <div><span>Instagram</span>${urlInsta ? `<a href="${esc(urlInsta)}" target="_blank" rel="noopener">${esc(arroba)} ↗</a>` : `<b class="apagado">${'instagram_ativo' in e ? 'não achado' : 'não analisado'}</b>`}</div>
          <div><span>Contato</span>${linksContato(e)}</div>
        </div>
        ${e.site_velocidade ? `<p class="r-velocidade"><b class="${e.site_velocidade.nota < 50 ? 'ruim' : e.site_velocidade.nota < 90 ? 'medio' : 'bom'}">${e.site_velocidade.nota}/100</b> velocidade no celular · o conteúdo principal aparece em ${esc(e.site_velocidade.carrega)} · página com ${esc(e.site_velocidade.peso)}</p>` : ''}
        ${e.site_problemas ? `<div class="r-problemas"><span>O que dá para melhorar no site</span><ul>${e.site_problemas.split(/;\s*/).filter(Boolean).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
        ${defeito ? `<p class="r-defeito"><b>Site fora do ar.</b> ${esc(defeito.charAt(0).toUpperCase() + defeito.slice(1))}. Bom argumento para oferecer um site novo.</p>` : ''}
        ${cat !== 'aprovada' ? `<p class="r-motivo">${esc(e.motivos.join(' · '))}</p>` : ''}
        ${e.analise ? `<p class="r-analise-txt">${esc(e.analise)}</p>` : ''}
        ${podeProcurar ? `<div class="r-procura"><button class="r-btn" data-procurar="${chave}"${procurando ? ' disabled' : ''}>${procurando === chave ? 'Procurando… (1 a 2 min)' : e.contato_procurado ? 'Procurar de novo' : 'Procurar perfil e contato'}</button><small>${e.contato_procurado ? 'Já fiz a busca caprichada.' : 'Testa o site e faz uma busca caprichada do Instagram e do WhatsApp. Usa seu plano do Claude, não gasta nota do Google.'}</small></div>` : ''}
      </div>` : ''}
    </div>`;
}

// a pesquisa roda no servidor; o painel pergunta o progresso a cada 1,5 s
let acompanhando = false;
async function acompanharBusca() {
  if (acompanhando) return;
  acompanhando = true;
  while (true) {
    let p;
    try { p = await (await fetch('/api/ia/progresso')).json(); } catch { await new Promise((r) => setTimeout(r, 3000)); continue; }
    iaBusca.prog = p; iaBusca.inicio = (p.inicio || Date.now() / 1000) * 1000;
    if (p.estado === 'rodando') {
      iaBusca.carregando = true;
      if (secao === 'pesquisa' && !pqAberto) desenhar();
      await new Promise((r) => setTimeout(r, 1500));
      continue;
    }
    iaBusca.carregando = false;
    if (p.estado === 'pronta') { iaBusca.aprovadas = p.aprovadas || []; iaBusca.descartadas = p.descartadas || []; iaResultadoAba = 'aprovadas'; buscaAberta = ''; avisar(`Pesquisa pronta: ${iaBusca.aprovadas.length} aprovada(s)`); }
    if (p.estado === 'erro') { iaBusca.erro = p.erro; avisar(p.erro); }
    acompanhando = false;
    return carregar();
  }
}

async function iaAcao(acao, alvo) {
  try {
    if (acao === 'outscraper-chave') { await postJson('/api/maps/chave-outscraper', { chave: $('outscraper-chave').value }); avisar('Chave do Outscraper salva'); return carregar(); }
    if (acao === 'ia-entrar-plano') { await postJson('/api/ia/entrar-plano', {}); avisar('Abri o Terminal. Entre com a sua conta no navegador.'); return; }
    if (acao === 'ia-limpar') {
      try { await postJson('/api/ia/limpar', {}); } catch (err) { avisar(err.message); return; }
      Object.assign(iaBusca, { aprovadas: [], descartadas: [], prog: {}, erro: '' });
      historicoBuscas = []; buscaAberta = ''; confirmaRepetir = null; resAberta = '';
      avisar('Pesquisas limpas'); desenhar(); return;
    }
    if (acao === 'ia-recarregar') { await carregar(); if (!planoLigado) avisar('Ainda não aparece o login. Termine no navegador e clique de novo.'); return; }
    if (acao === 'ia-buscar') {
      // o que está escrito num filtro aberto também vale
      iaBusca.mexeu = true;
      const digitadoNicho = $('ia-nicho')?.value.trim(), digitadoLocal = $('ia-local')?.value.trim();
      if (digitadoNicho) iaBusca.nicho = digitadoNicho;
      if (digitadoLocal) iaBusca.local = digitadoLocal;
      iaBusca.quantidade = Math.min(40, Math.max(5, Number(iaBusca.quantidade) || 15)); pqAberto = '';
      iaBusca.erro = '';
      const igual = historicoBuscas.find((h) => semAcento(h.nicho) === semAcento(iaBusca.nicho) && semAcento(h.local) === semAcento(iaBusca.local));
      if (igual && !alvo.dataset.repetir) { confirmaRepetir = igual; return desenhar(); }
      confirmaRepetir = null;
      try { await postJson('/api/ia/buscar', { nicho: iaBusca.nicho, local: iaBusca.local, quantidade: iaBusca.quantidade }); }
      catch (e) { iaBusca.erro = e.message; return desenhar(); }
      if (!ehAdmin()) fetch('/api/eu').then((r) => r.json()).then((j) => { eu = j; }).catch(() => {});
      iaBusca.carregando = true; iaBusca.inicio = Date.now(); iaBusca.prog = { etapa: 0 };
      desenhar(); acompanharBusca();
      return;
    }
    if (acao === 'ia-preparar') {
      const cnpj = cnpjDe(alvo);
      iaPreparando = cnpj; desenhar();
      try {
        const j = await postJson('/api/ia/preparar', { cnpj });
        avisar(`Pronto: ${j.arquivos.join(', ')}`);
      } catch (e) { avisar(e.message); }
      iaPreparando = '';
      return carregar();
    }
  } catch (e) { avisar(e.message); }
}

function textosWhats(e) {

  const v = [...String(e.cnpj)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 3;
  const saud = new Date().getHours() < 12 ? 'bom dia' : new Date().getHours() < 18 ? 'boa tarde' : 'boa noite';

  // resposta só de robô: fala com quem atende, sem cara de agendamento (pedido dele: "contornar isso")
  const posRobo = [`Oi! Não é agendamento não 🙂 Sou o ${meuNome()}, faço sites${minhaCidade()}. Montei um exemplo de site pra ${curto}: ${link}\nConsegue mostrar pra responsável quando der?`,

}

const radar = { raf: 0, pinos: null, ang: 0 };
function iniciaRadar() {

  const ctx = tela.getContext('2d');
  const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let sorte = 7; const acaso = () => (sorte = (sorte * 16807) % 2147483647) / 2147483647;
  if (!radar.pinos) radar.pinos = Array.from({ length: 46 }, () => ({ x: .3 + acaso() * .7, y: .08 + acaso() * .86, nota: (4.1 + acaso() * .9).toFixed(1).replace('.', ','), luz: 0, rotulo: acaso() < .35 }));
  const ruas = [];
  sorte = 3;
  for (let i = 0; i < 26; i++) ruas.push({ v: i % 2 === 0, p: acaso(), w: acaso() < .2 ? 2 : 1 });
  function quadro(t) {
    const dpr = devicePixelRatio || 1, W = tela.clientWidth, H = tela.clientHeight;
    if (tela.width !== Math.round(W * dpr)) { tela.width = Math.round(W * dpr); tela.height = Math.round(H * dpr); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    const cx = W * .72, cy = H * .62, R = Math.hypot(W, H) * .55;
    // ruas levemente inclinadas, como o traçado em T de Goiânia
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-.12); ctx.translate(-cx, -cy);
    ruas.forEach((r) => { ctx.strokeStyle = `rgba(255,255,255,${r.w > 1 ? .09 : .045})`; ctx.lineWidth = r.w; ctx.beginPath();
      if (r.v) { const x = W * .2 + r.p * W; ctx.moveTo(x, -20); ctx.lineTo(x, H + 20); } else { const y = r.p * H; ctx.moveTo(W * .15, y); ctx.lineTo(W + 20, y); }
      ctx.stroke(); });
    ctx.restore();
    // anéis do radar
    ctx.strokeStyle = 'rgba(205,245,74,.10)'; ctx.lineWidth = 1;
    [.18, .36, .54, .72].forEach((f) => { ctx.beginPath(); ctx.arc(cx, cy, R * f, 0, Math.PI * 2); ctx.stroke(); });
    // varredura
    if (!calmo) radar.ang = (t / 1000) * .9 % (Math.PI * 2);
    const a = radar.ang;
    const g = ctx.createConicGradient ? ctx.createConicGradient(a - .9, cx, cy) : null;
    if (g) { g.addColorStop(0, 'rgba(205,245,74,0)'); g.addColorStop(.14, 'rgba(205,245,74,.20)'); g.addColorStop(.1432, 'rgba(205,245,74,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a - .9, a); ctx.closePath(); ctx.fill(); }
    ctx.strokeStyle = 'rgba(205,245,74,.55)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
    // empresas: acendem quando a varredura passa
    radar.pinos.forEach((p) => {
      const px = p.x * W, py = p.y * H;
      const ang = (Math.atan2(py - cy, px - cx) + Math.PI * 2) % (Math.PI * 2);
      const dif = (a - ang + Math.PI * 2) % (Math.PI * 2);
      if (dif < .06) p.luz = 1;
      p.luz = calmo ? .5 : Math.max(0, p.luz - .006);
      ctx.fillStyle = `rgba(255,255,255,${.18 + p.luz * .2})`; ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI * 2); ctx.fill();
      if (p.luz > .02) {
        ctx.strokeStyle = `rgba(205,245,74,${p.luz * .35})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
        ctx.fillStyle = `rgba(205,245,74,${p.luz})`; ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = `rgba(205,245,74,${p.luz * .6})`; ctx.beginPath(); ctx.arc(px, py, 4 + (1 - p.luz) * 16, 0, Math.PI * 2); ctx.stroke();
        if (p.rotulo && p.luz > .25) { ctx.font = '500 10.5px "Geist Mono", monospace'; ctx.fillStyle = `rgba(205,245,74,${p.luz})`; ctx.fillText(`★ ${p.nota}`, px + 9, py + 3.5); }
      }
    });
    // centro
    ctx.fillStyle = '#cdf54a'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
    if (!calmo && document.body.contains(tela)) radar.raf = requestAnimationFrame(quadro);
  }
  radar.raf = requestAnimationFrame(quadro);
}

async function enviarFoto(cnpj, papel, arquivo) {
  avisar('Enviando foto...');
  const base64 = await new Promise((ok, erro) => {
    const leitor = new FileReader();
    leitor.onload = () => ok(String(leitor.result).split(',')[1]);
    leitor.onerror = erro;
    leitor.readAsDataURL(arquivo);
  });
  const r = await fetch('/api/foto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cnpj, papel, base64 }) });
  const j = await r.json();
  if (!r.ok) return avisar(j.erro);
  const b = sub(cnpj, 'b');
  b.fotos = { ...(b.fotos || {}), [papel]: j.arquivo };
  salvar();
  avisar('Foto enviada. Gere a prévia de novo.');
  desenhar();
}

function exportar() {
  const campos = [['Empresa', (e) => e.nome], ['CNPJ', (e) => e.cnpj_formatado], ['Instagram', (e, r) => r.instagram], ['Nota', (e, r) => r.nota], ['Avaliações', (e, r) => r.avaliacoes], ['Situação', (e, r) => ETAPAS_CONVERSA.find(([v]) => v === (r.m?.status || ''))[1]], ['Enviada em', (e, r) => r.m?.enviada_em], ['Retornos', (e, r) => r.m?.retornos || 0], ['Anotação', (e, r) => r.m?.obs]];
  const celula = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const linhas = aprovadas().map((e) => campos.map(([, f]) => celula(f(e, estado[e.cnpj] || {}))).join(';'));
  const csv = '﻿' + [campos.map(([n]) => celula(n)).join(';'), ...linhas].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'prospeccao-resultado.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

// A aba do app pode bloquear a área de transferência; o caminho antigo cobre esse caso.
async function copiar(texto) {
  try {
    await navigator.clipboard.writeText(texto);
    return true;
  } catch {
    const campo = document.createElement('textarea');
    campo.value = texto;
    document.body.append(campo);
    campo.select();
    const ok = document.execCommand('copy');
    campo.remove();
    return ok;
  }
}
