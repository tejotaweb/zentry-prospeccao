  if ('edCancelar' in d) { if (edHist.length && !confirm('Descartar as alterações?')) return; pvEditar = false; edSel = null; desenhar(); return; }
  if ('pvMenu' in d) { pvMenu = !pvMenu; desenhar(); return; }
  if ('pvChat' in d) { pvChat = !pvChat; try { localStorage.setItem('pvChat', pvChat ? '1' : '0'); } catch {} desenhar(); return; }
  if ('pvCheia' in d) { pvTelaCheia = !pvTelaCheia; desenhar(); return; }
  if (d.previaTela) { previaTela = d.previaTela; desenhar(); return; }
  if (d.ajustar) {
    const texto = ajusteTexto.trim();
    if (texto.length < 3 && !ajusteImgs.length) { avisar('Escreva o que você quer mudar.'); return; }
    try { await postJson('/api/ia/ajustar-previa', { cnpj: d.ajustar, pedido: texto, imagens: ajusteImgs }); ajusteTexto = ''; ajusteImgs = []; avisar('Pedido enviado. A prévia atualiza sozinha quando o Claude terminar.'); await carregar(); } catch (err) { avisar(err.message); }
    return;
  }
  if (d.irPrevia) { previaAberta = d.irPrevia; previaFixa = d.irPrevia; empAberta = ''; secao = 'previas'; desenhar(); scrollTo(0, 0); return; }
  if (d.trocarModelo) {
    try { const r = await postJson('/api/ia/trocar-modelo', { cnpj: d.trocarModelo }); avisar(`Montada de novo com o modelo ${r.receita} em ${r.segundos} s.`); await carregar(); } catch (err) { avisar(err.message); }
    return;
  }
  if (d.gerarPrevias) {
    try { const r = await postJson('/api/ia/previas-auto', { cnpjs: d.gerarPrevias.split(',') }); avisar(r.novas ? `${r.novas} prévia(s) na fila. Cada uma sai do modelo pronto em segundos; as fotos do Google chegam logo depois.` : 'Essas já estão na fila.'); await carregar(); } catch (err) { avisar(err.message); }
    return;
  }
  if (d.etiqAbre) {
    if (etiqMenu?.cnpj === d.etiqAbre) { etiqMenu = null; desenhar(); return; }
    const r = alvo.getBoundingClientRect();
    etiqMenu = { cnpj: d.etiqAbre, x: Math.min(r.left, innerWidth - 236), y: r.bottom + 230 > innerHeight ? Math.max(8, r.top - 330) : r.bottom + 6 };
    desenhar(); document.querySelector('.g-menu [aria-checked=true]')?.focus(); return;
  }
  if ('etiqFecha' in d) { etiqMenu = null; desenhar(); return; }
  if (d.etiqEscolhe !== undefined) { const k = d.etiqEscolhe; mudarEtiqueta(etiqMenu.cnpj, k); etiqMenu = null; avisar(`Etiqueta: ${ETIQ[k][0]}`); desenhar(); return; }
  if (d.envioAbriu) { envioAbriu = d.envioAbriu; setTimeout(desenhar, 300); }
  if ('envioComecar' in d) { envioModo = true; envioPulados = []; desenhar(); scrollTo(0, 0); return; }
  if ('envioSair' in d) { envioModo = false; desenhar(); return; }
  if (d.envioPula) { envioPulados.push(d.envioPula); desenhar(); return; }
  if (d.envioFeito) {
    const c = d.envioFeito, mm = sub(c, 'm'), dia = hoje();
    if (d.envioTipo === 'retorno') { mm.retornos = (mm.retornos || 0) + 1; mm.ultimo_em = dia; mm.atualizado_em = Date.now(); salvar(); }
    else if (d.envioTipo === 'robo') { mm.previa_enviada = dia; mm.ultimo_em = dia; mm.atualizado_em = Date.now(); salvar(); }
    else { mudarEtiqueta(c, 'enviada'); mm.canal = d.envioCanal; }
    envioLivreEm = Date.now() + (60 + Math.floor(Math.random() * 90)) * 1000; // 1 a 2,5 minutos, como uma pessoa
    avisar('Marcado. Próxima.'); desenhar(); return;
  }
  if (d.respTipo) { respostaTipo = respostaTipo === d.respTipo ? '' : d.respTipo; desenhar(); return; }
  if (d.respMarca) { mudarEtiqueta(msgAberta, d.respMarca); respostaTipo = ''; avisar(`Etiqueta: ${ETIQ[d.respMarca][0]}`); desenhar(); return; }
  if (d.irMsg) { msgAberta = d.irMsg; msgAba = etapaMsg(empresas().find((x) => x.cnpj === d.irMsg) || {}); secao = 'mensagens'; desenhar(); scrollTo(0, 0); return; }
  if (d.msgAba) { msgAba = d.msgAba; msgMostrar = 50; desenhar(); return; }
  if ('msgMais' in d) { msgMostrar += 50; desenhar(); return; }
  if (d.msgCanal) { msgCanal[msgAberta] = d.msgCanal; desenhar(); return; }
  if (d.msgAbre) { msgAberta = d.msgAbre; respostaTipo = ''; desenhar(); return; }
  if (d.msgMarca) {
    const c = msgAberta, mm = sub(c, 'm'), dia = hoje();
    if (d.msgMarca === 'enviada') { mudarEtiqueta(c, 'enviada'); mm.canal = (msgCanal[c] || (contatosDe(empresas().find((x) => x.cnpj === c) || {}).zap ? 'whatsapp' : 'instagram')) === 'instagram' ? 'Instagram' : 'WhatsApp'; }
    if (d.msgMarca === 'auto') { mm.auto = dia; mm.auto_em = Date.now(); mm.atualizado_em = Date.now(); salvar(); }
    if (d.msgMarca === 'previa') { mm.previa_enviada = dia; mm.atualizado_em = Date.now(); salvar(); }
    if (d.msgMarca === 'retorno') { mm.retornos = (mm.retornos || 0) + 1; mm.ultimo_em = dia; mm.atualizado_em = Date.now(); salvar(); }
    avisar('Marcado.'); desenhar(); return;
  }
  if (d.empFiltro) { empFiltro = d.empFiltro; desenhar(); return; }
  if ('empFecha' in d) { empAberta = ''; desenhar(); return; }
  if (d.empAbre && !ev.target.closest('a, select, label')) { empAberta = d.empAbre; desenhar(); return; }
  if (d.geralFiltro) { geralFiltro = d.geralFiltro; geralSel = ''; desenhar(); return; }
  if (d.geralSel) { geralSel = d.geralSel; desenhar(); return; }
  if (d.pq) { pqAberto = pqAberto === d.pq ? '' : d.pq; desenhar(); if (pqAberto === 'nicho' || pqAberto === 'local') setTimeout(() => document.querySelector('.q-pop-busca input')?.focus()); return; }
  if ('nichoUsar' in d) { const v = $('ia-nicho')?.value.trim(); if (v) { iaBusca.mexeu = true; iaBusca.nicho = v; } pqAberto = ''; desenhar(); return; }
  if ('localUsar' in d) { const v = $('ia-local')?.value.trim(); if (v) { iaBusca.mexeu = true; iaBusca.local = v; } pqAberto = ''; desenhar(); return; }
  if (d.localChip) { iaBusca.mexeu = true; iaBusca.local = d.localChip; pqAberto = ''; desenhar(); return; }
  if (d.qtdChip) { iaBusca.mexeu = true; iaBusca.quantidade = Number(d.qtdChip); pqAberto = ''; desenhar(); return; }
  if (d.abreBusca) {
    const h = historicoBuscas.find((x) => x.id === d.abreBusca);
    if (h) { Object.assign(iaBusca, { aprovadas: h.aprovadas || [], descartadas: h.descartadas || [], nicho: h.nicho, local: h.local, quantidade: h.quantidade || iaBusca.quantidade, mexeu: true, prog: { ...h, estado: 'pronta' } }); buscaAberta = h.id; confirmaRepetir = null; iaResultadoAba = (h.aprovadas || []).length ? 'aprovadas' : 'descartadas'; desenhar(); document.querySelector('.f-caminho')?.scrollIntoView({ behavior: 'smooth' }); }
    return;
  }
  if ('fechaAviso' in d) { confirmaRepetir = null; desenhar(); return; }
  if (d.porNaLista !== undefined) {
    const e = iaBusca.descartadas[Number(d.porNaLista)];
    try { await postJson('/api/ia/adicionar', { empresas: [e], preencher: true, nicho: iaBusca.nicho }); avisar(`${e.nome} entrou em Empresas`); await carregar(); } catch (err) { avisar(err.message); }
    return;
  }
  if (d.procurar) {
    const lista = d.procurar[0] === 'a' ? iaBusca.aprovadas : iaBusca.descartadas;
    const e = lista[Number(d.procurar.slice(1))];
    procurando = d.procurar; desenhar();
    try {
      const r = await postJson('/api/ia/procurar-contato', { place_id: e.place_id || '', nome: e.nome });
      Object.assign(e, r.empresa);
      if (r.empresa.entrou_na_lista) {
        iaBusca.descartadas = iaBusca.descartadas.filter((x) => x !== e); iaBusca.aprovadas.push(e);
        avisar(`${e.nome} passou na régua e entrou em Empresas`); await carregar();
      } else avisar(r.empresa.instagram ? `Achei o Instagram de ${e.nome}` : `Não achei o Instagram de ${e.nome}`);
    } catch (err) { avisar(err.message); }
    procurando = ''; desenhar();
    return;
  }
  if (d.resAba) { iaResultadoAba = d.resAba; resFiltro = 'todas'; desenhar(); return; }
  if (d.resFiltro) { resFiltro = d.resFiltro; desenhar(); return; }
  if (d.resAbre && !ev.target.closest('button, a')) { resAberta = resAberta === d.resAbre ? '' : d.resAbre; desenhar(); return; }
  if (d.nichoChip) { iaBusca.mexeu = true; iaBusca.nicho = d.nichoChip; pqAberto = ''; desenhar(); return; }
  if ('notif' in d) { notifAberto = !notifAberto; desenhar(); return; }
  if ('notifLidas' in d) { marcaLidas(notificacoes().map((n) => n.id)); desenhar(); return; }
  if (d.notifIr) { marcaLidas([d.notifId]); notifAberto = false; secao = d.notifIr; desenhar(); scrollTo(0, 0); return; }
  if (d.cfgTema) { if (d.cfgTema === 'claro') document.documentElement.dataset.tema = 'claro'; else delete document.documentElement.dataset.tema; try { localStorage.setItem('tema', d.cfgTema); } catch {} desenhar(); return; }
  if ('cfgSalvar' in d) { const corpo = {}; document.querySelectorAll('[data-cfg]').forEach((i) => { corpo[i.dataset.cfg] = i.value; }); salvaConfig(corpo, 'Configurações salvas'); return; }
  if ('perfilSalvar' in d) { const perfil = {}; document.querySelectorAll('[data-perfil]').forEach((i) => { perfil[i.dataset.perfil] = i.value; }); salvaConfig({ perfil }, 'Perfil salvo'); return; }
  if (d.irEmpresa) { geralSel = d.irEmpresa; empAberta = d.irEmpresa; empFiltro = 'todas'; buscaEmpresas = ''; secao = 'lista'; desenhar(); scrollTo(0, 0); return; }
  if (d.previa) { if (pvEditar && edHist.length && !confirm('Sair sem salvar as alterações?')) return; previaAberta = d.previa; if (d.previa !== previaFixa) previaFixa = ''; pvMenu = false; pvEditar = false; ajusteImgs = []; desenhar(); return; }
  if (d.veredito) {
    const c = cnpjDe(alvo); reg(c).veredito = d.veredito; salvar(); desenhar();
    // regra dele (03/11): todo site aprovado sobe para o link do cliente
    if (d.veredito === 'aprovada' && !producao[c]?.link) {
      previaFixa = c; publicando = c; desenhar();
      try { const r = await postJson('/api/ia/publicar', { cnpj: c }); await carregar(); avisar(`Aprovada e publicada: ${r.link} (no ar em 1 a 3 minutos). Ela ficou guardada em Empresas.`); }
      catch (err) { avisar(`Aprovada, mas não publicou: ${err.message}`); }
      publicando = '';
    } else if (d.veredito === 'aprovada') avisar('Aprovada. Ela ficou guardada em Empresas.');
    // a aprovada sai da tela de prévias e a próxima que espera aprovação aparece
    if (d.veredito === 'aprovada' && previaFixa === c) previaFixa = '';
    if (d.veredito === 'aprovada' && secao === 'previas') { pvEditar = false; desenhar(); }
    return;
  }
  if (d.acao === 'tema') {
    const claro = document.documentElement.dataset.tema !== 'claro';
    if (claro) document.documentElement.dataset.tema = 'claro'; else delete document.documentElement.dataset.tema;
    try { localStorage.setItem('tema', claro ? 'claro' : 'escuro'); } catch {}
    desenhar();
    return;
  }
  if (['ia-buscar', 'ia-limpar', 'ia-preparar', 'ia-entrar-plano', 'ia-recarregar', 'outscraper-chave'].includes(d.acao)) return iaAcao(d.acao, alvo);
  if (d.acao === 'arsenal-fora') { arsenalMostrarFora = !arsenalMostrarFora; desenhar(); return; }
  if (d.secao) { secao = d.secao; desenhar(); window.scrollTo(0, 0); return; }
  if (d.aba) { aba = d.aba; desenhar(); return; }
  if (d.copiar !== undefined) {
    avisar(await copiar(d.copiar) ? 'Copiado' : 'Não copiou. Selecione o texto à mão.');
    return;
  }
  const cnpj = cnpjDe(alvo);
  if (d.acao === 'gerar') return gerarPrevia(cnpj);
  if (d.acao === 'exportar') return exportar();
  if (d.acao === 'enviei') {
    Object.assign(sub(cnpj, 'm'), { status: 'enviada', enviada_em: hoje(), ultimo_em: hoje(), retornos: 0, atualizado_em: Date.now() });
    salvar();
    desenhar();
  }
  if (d.acao === 'retorno') {
    const m = sub(cnpj, 'm');
    m.retornos = (m.retornos || 0) + 1;
    m.ultimo_em = hoje();
    salvar();
    desenhar();
  }
});

// Nota, avaliações e site do Maps entram fora do que é salvo: JSON.stringify ignora campos não enumeráveis.
function aplicarMaps(emp) {
  const r = reg(emp.cnpj);
  const vivo = { nota: emp.nota, avaliacoes: emp.avaliacoes, site: emp.erro ? '' : (temSiteProprio(emp.site) ? 'tem' : 'nao'), site_url: temSiteProprio(emp.site) ? emp.site : '' };
  Object.entries(vivo).forEach(([k, v]) => Object.defineProperty(r, k, { value: v, enumerable: false, writable: true, configurable: true }));
}

async function carregar() {
  const dados = await (await fetch('/api/dados')).json();
  if (!arsenal.length) { try { arsenal = await (await fetch('/api/arsenal')).json(); } catch { arsenal = []; } }
  estado = dados.estado || {};
  producao = dados.producao || {};
  filaPrevias = dados.fila_previas || {};
  acompanharFila();
  receitaStatus = dados.receita;
  planoLigado = dados.plano_ligado;
  try { historicoBuscas = await (await fetch('/api/ia/historico')).json(); } catch { historicoBuscas = []; }
  cfg = dados.config || cfg;
  META = cfg.meta ?? META; LIMITE_DIA = cfg.limite_dia ?? LIMITE_DIA; NOTA_MIN = cfg.nota_min ?? NOTA_MIN; AVAL_MIN = cfg.avaliacoes_min ?? AVAL_MIN;
  if (!iaBusca.mexeu && cfg.nicho_padrao) Object.assign(iaBusca, { nicho: cfg.nicho_padrao, local: cfg.local_padrao, quantidade: cfg.quantidade_padrao });
  outscraperLigado = dados.outscraper_ligado; outscraperUso = dados.outscraper_uso; outscraperLimite = dados.outscraper_limite;
  exemplo = !dados.lista && !dados.maps.length && !dados.manuais.length;
  if (exemplo) {
    lista = EXEMPLO;
    estado = JSON.parse(JSON.stringify(ESTADO_EXEMPLO));
    producao = { 'exemplo-A': { analise: true, copy: false, fotos: 0, layout: false }, 'exemplo-B': { analise: true, copy: true, fotos: 4, layout: true } };
  } else {
    const base = dados.lista || { rotulo: 'Dentistas · Goiânia', titulo: 'Painel de prospecção', fonte: 'A lista da Receita ainda não saiu. Aqui estão só as empresas adicionadas à mão.', funil: [], empresas: [] };
    lista = { ...base, empresas: [...base.empresas, ...dados.manuais, ...dados.maps] };
    dados.maps.forEach(aplicarMaps);
  }
  desenhar();
}

try { if (localStorage.getItem('tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch {}
carregar().then(() => fetch('/api/ia/progresso').then((r) => r.json()).then((p) => { if (p.estado === 'rodando') { iaBusca.carregando = true; acompanharBusca(); } else if (p.estado === 'pronta' && !iaBusca.aprovadas.length && !iaBusca.descartadas.length) { iaBusca.aprovadas = p.aprovadas || []; iaBusca.descartadas = p.descartadas || []; iaBusca.prog = p; if (secao === 'pesquisa') desenhar(); } }).catch(() => {}));
</script>
