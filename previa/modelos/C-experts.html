<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="receita" content="C · Meet Our Experts/GreenVision: título enorme centralizado, fotos reais soltas em cartões, pílulas com fatos e ícones ligados por linhas">
<meta name="fonte" content="Instrument Sans">
<meta name="ordem" content="bento,servicos:abas,faixa,equipe,situacoes,passos,galeria,duvidas,contato,chamada">
<title>{{titulo_pagina}}</title>
{{fontes}}
<style>{{css}}</style>
<style>{{tokens}}
/* ---- abertura C ---- */
.heroC{position:relative;overflow:hidden;padding-block:clamp(40px,6vw,80px) 40px;min-height:min(calc(100vh - 110px),860px);display:flex;flex-direction:column;justify-content:center}
.heroC .centro{position:relative;z-index:3;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;max-width:760px;margin-inline:auto}
.heroC h1{font-size:clamp(44px,5.6vw,88px);line-height:.98;letter-spacing:-.05em}
.heroC h1 .cinza{display:block}
.heroC .sub{font-size:18px;color:var(--cinza);max-width:48ch}
.heroC .botoes{justify-content:center}
.heroC .fotos{position:absolute;inset:0;z-index:1;pointer-events:none}
.heroC .f{position:absolute;border-radius:26px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(0,0,0,.45);animation:flutua 9s ease-in-out infinite;pointer-events:auto;transition:transform .5s}
.heroC .f img{width:100%;height:100%}
.heroC .f:hover{transform:scale(1.04)}
.heroC .f1{left:2%;top:12%;width:12vw;max-width:190px;aspect-ratio:1;animation-delay:-1s}
.heroC .f2{left:16%;top:1%;width:9vw;max-width:140px;aspect-ratio:1;animation-delay:-3s}
.heroC .f3{right:13%;top:2%;width:10vw;max-width:160px;aspect-ratio:4/5;animation-delay:-5s}
.heroC .f4{right:2%;top:30%;width:11vw;max-width:180px;aspect-ratio:1;animation-delay:-2s}
.heroC .f5{left:3%;bottom:6%;width:12vw;max-width:190px;aspect-ratio:4/5;animation-delay:-4s}
.heroC .f6{right:5%;bottom:2%;width:11vw;max-width:180px;aspect-ratio:1;animation-delay:-6s}
.heroC .f7{left:15%;bottom:32%;width:5vw;max-width:80px;aspect-ratio:1;border-radius:18px;animation-delay:-7s}
@keyframes flutua{50%{transform:translateY(-12px)}}
.heroC .fato{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;font-size:14px;background:var(--claro);color:var(--cor-forte);font-weight:500;white-space:nowrap;animation:flutua 7s ease-in-out infinite}
.heroC .fato svg{width:16px;height:16px}
.heroC .fato mark{font-size:11px}
.heroC .fato-1{left:3%;top:47%}
.heroC .fato-3{right:3%;bottom:30%;animation-delay:-3s}
.heroC .centro .fato{position:static;animation:none;background:var(--fundo2);color:var(--tinta)}
.heroC .fatos-m{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
.heroC .linhas{position:absolute;inset:0;z-index:0;width:100%;height:100%;fill:none;stroke:var(--medio);stroke-width:1.2;stroke-dasharray:4 7}
.heroC .ajuda{position:relative;z-index:3;margin-top:42px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:13px;color:var(--cinza)}
.heroC .ajuda div{display:flex;gap:10px}
.heroC .ajuda a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--claro);color:var(--cor-forte);transition:transform .3s,background .3s,color .3s}
.heroC .ajuda a:hover{transform:translateY(-4px);background:var(--cor);color:var(--sobre)}
.heroC .ajuda a svg{width:21px;height:21px}
.heroC .brilho{position:absolute;right:30%;top:30%;width:28px;height:28px;color:var(--cor);z-index:2;animation:gira 12s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
@media (max-width:980px){
  .heroC{min-height:0}
  .heroC .fotos{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;order:2;margin-top:36px;padding-inline:var(--x)}
  .heroC .f{position:relative;inset:auto;width:auto;max-width:none;left:auto;right:auto;top:auto;bottom:auto;aspect-ratio:1}
  .heroC .f7,.heroC .linhas,.heroC .brilho{display:none}
  .heroC>.fato{display:none}
}
</style>
</head>
<body>
{{aviso}}
{{menu}}
<main id="inicio">
<section class="heroC">
  <svg class="linhas" viewBox="0 0 1440 800" preserveAspectRatio="none" aria-hidden="true"><path d="M150 230C330 120 420 120 560 90"/><path d="M1180 140C1260 260 1300 300 1350 330"/><path d="M180 640C300 560 360 560 420 540"/><path d="M1100 720C1200 640 1260 620 1320 600"/></svg>
  <div class="fotos" aria-hidden="true">
    <figure class="f f1" style="margin:0"><img src="{{foto:1}}" alt=""></figure>
    <figure class="f f2" style="margin:0"><img src="{{foto:2}}" alt=""></figure>
    <figure class="f f3" style="margin:0"><img src="{{retrato}}" alt=""></figure>
    <figure class="f f4" style="margin:0"><img src="{{foto:3}}" alt=""></figure>
    <figure class="f f5" style="margin:0"><img src="{{foto:4}}" alt=""></figure>
    <figure class="f f6" style="margin:0"><img src="{{foto:5}}" alt=""></figure>
    <figure class="f f7" style="margin:0"><img src="{{foto:6}}" alt=""></figure>
  </div>
  <svg class="brilho" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c.8 6.6 5.4 11.2 12 12-6.6.8-11.2 5.4-12 12-.8-6.6-5.4-11.2-12-12C6.6 11.2 11.2 6.6 12 0z"/></svg>
  {{fato:1}}{{fato:3}}
  <div class="centro g">
    <p class="rotulo pilula">{{nome}} · {{bairro}}</p>
    <h1 data-palavras>{{titulo1}} <span class="cinza">{{titulo2}}</span></h1>
    <p class="sub">{{subtitulo}}</p>
    <div class="botoes">{{botao_cor}}{{botao2}}</div>
    <div class="fatos-m">{{fato:2}}{{fato:4}}{{fato:5}}</div>
  </div>
  <div class="ajuda">Fale com a {{nome}}<div><a href="{{whats_link}}" target="_blank" rel="noopener" aria-label="WhatsApp">{{ico_whats}}</a><a href="#contato" aria-label="Endereço">{{ico_pino}}</a><a href="#como" aria-label="Como funciona">{{ico_calendario}}</a></div></div>
</section>
{{secoes}}
</main>
{{rodape}}
{{whats_flutuante}}
<script>{{js}}</script>
</body>
</html>
